/* --- جدول نوبة معينة (من بيانات الجدول في التقارير) --- */
function renderStaffSchedule(shift, rows, floors) {
  var html = '';
  var now = new Date();
  var selYear = now.getFullYear();
  var selMonth = now.getMonth();
  if(S.schedSelMonth) {
    var mParts = S.schedSelMonth.split('-');
    selYear = parseInt(mParts[0]);
    selMonth = parseInt(mParts[1]) - 1;
  }

  /* استخدام بيانات الجدول من التقارير */
  var schedAllRows = shift==='morning' ? S.schedMRows : shift==='evening' ? S.schedERows : S.schedORows;

  /* الحصول على جميع تواريخ الشهر حسب نوع النوبة */
  var schedDates = getSchedDates(selYear, selMonth, shift);
  var dayColors = {0:['#FDE8EC','#FA383E'],1:['#E7F3FF','#1877F2'],2:['#E6F9EE','#42B72A'],3:['#FFF8E1','#F7B928'],4:['#EDE7F6','#7C4DFF'],5:['#FFF8E1','#F7B928'],6:['#E7F3FF','#1877F2']};

  var totalCount = 0;
  var hasAnyData = false;

  /* عرض البيانات لكل تاريخ */
  schedDates.forEach(function(dInfo) {
    var dateSched = schedAllRows[dInfo.dateStr] || {};
    var dateHasData = false;
    var dateHtml = '';

    floors.forEach(function(f) {
      var assigned = [];
      /* للوسطي والمبيت: جمع الصيادلة من الطوابق الفرعية */
      if(f.subs) {
        f.subs.forEach(function(subId) {
          var subRows = dateSched[subId];
          if(subRows) {
            subRows.forEach(function(pid) { if(pid) assigned.push(pid); });
          }
        });
      } else {
        var floorRows = dateSched[f.id];
        if(floorRows) {
          floorRows.forEach(function(pid) { if(pid) assigned.push(pid); });
        }
      }

      if(!assigned.length) return;
      dateHasData = true;
      totalCount += assigned.length;
      dateHtml += '<div style="margin-bottom:8px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><i data-lucide="'+(f.icon||'layers')+'" style="width:14px;height:14px;color:'+(f.clr||'var(--pri)')+'"></i> <span style="font-weight:600;font-size:.8rem;color:'+(f.clr||'var(--pri)')+'">'+toEN(S.lang==='ar'?f.ar:f.en)+'</span> <span style="font-size:.68rem;color:var(--mut)">('+assigned.length+')</span></div>';
      assigned.forEach(function(pid) {
        var p = S.pharms.find(function(x){return x.id===pid});
        if(!p) return;
        dateHtml += '<div class="ph-row ai" style="cursor:pointer;padding:8px 10px;margin-bottom:4px" data-act="pharm-detail" data-pid="'+p.id+'"><div class="ph-av" style="background:'+p.clr+';width:30px;height:30px;font-size:.7rem">'+p.en[0]+'</div>';
        dateHtml += '<div class="ph-inf"><div class="ph-nm" style="font-size:.82rem">'+phName(p)+'</div></div>';
        dateHtml += '</div>';
      });
      dateHtml += '</div>';
    });

    if(dateHasData) {
      hasAnyData = true;
      var dc = dayColors[dInfo.dayNum] || ['#F0F2F5','#65676B'];
      html += '<div class="flr-sec ai" style="margin-bottom:10px;overflow:hidden">';
      html += '<div class="flr-hd" style="cursor:pointer" data-act="toggle-staff-date" data-date="'+dInfo.dateStr+'">';
      html += '<div style="width:36px;height:36px;border-radius:10px;background:'+dc[1]+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;font-family:\'Noto Sans\',sans-serif">'+dInfo.date.getDate()+'</div>';
      html += '<div style="flex:1"><div style="font-weight:700;font-size:.88rem;color:'+dc[1]+'">'+dInfo.dayName+'</div>';
      html += '<div style="font-size:.7rem;color:var(--mut)">'+fmtPrintDate(dInfo.date)+'</div></div>';
      html += '<i data-lucide="chevron-down" style="width:16px;height:16px;color:var(--mut)"></i>';
      html += '</div>';
      html += '<div class="flr-rows" style="padding:8px 12px" id="staffDate_'+dInfo.dateStr+'">';
      html += dateHtml;
      html += '</div></div>';
    }
  });

  if(!hasAnyData) {
    /* إذا لا توجد بيانات جدول، نعرض من بيانات الحضور العادية */
    var today = todayStr();
    var todayDate = new Date();
    var dayIdx = todayDate.getDay();
    var dayN = S.lang==='ar' ? DAY_NAMES_AR[dayIdx] : DAY_NAMES_EN[dayIdx];
    html += '<div style="background:var(--pri-s);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px">';
    html += '<div style="width:36px;height:36px;border-radius:10px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;font-family:\'Noto Sans\',sans-serif">'+todayDate.getDate()+'</div>';
    html += '<div><div style="font-weight:700;font-size:.88rem;color:var(--pri)">'+dayN+'</div>';
    html += '<div style="font-size:.72rem;color:var(--pri);opacity:.8">'+fmtPrintDate(todayDate)+'</div></div>';
    html += '</div>';
    floors.forEach(function(f) {
      var floorRows = rows[f.id];
      if(!floorRows) return;
      var assigned = floorRows.filter(function(id) { return id !== null; });
      if(!assigned.length) return;
      totalCount += assigned.length;
      html += '<div class="mb-16"><div class="stitle"><i data-lucide="'+(f.icon||'layers')+'" style="color:'+(f.clr||'var(--pri)')+'"></i> '+toEN(S.lang==='ar'?f.ar:f.en)+' <span style="font-weight:400;font-size:.78rem;color:var(--mut)">('+assigned.length+')</span></div>';
      assigned.forEach(function(pid) {
        var p = S.pharms.find(function(x){return x.id===pid});
        if(!p) return;
        html += '<div class="ph-row ai" style="cursor:pointer" data-act="pharm-detail" data-pid="'+p.id+'"><div class="ph-av" style="background:'+p.clr+'">'+p.en[0]+'</div>';
        html += '<div class="ph-inf"><div class="ph-nm">'+phName(p)+(p.cat?' <span style="font-size:.68rem;font-weight:600;color:var(--pri)">'+(p.cat==='practicing'?t('catPracticing'):p.cat==='exempt'?t('catExempt'):t('catTrainee'))+'</span>':'')+'</div><div class="ph-id">'+p.id+' · '+flrName(p.fl)+'</div></div>';
        html += '<i data-lucide="chevron-left" style="width:18px;height:18px;color:var(--mut);flex-shrink:0"></i></div>';
      });
      html += '</div>';
    });
  }

  if(!html) html = '<div class="empty"><i data-lucide="calendar"></i><p>'+t('noData')+'</p></div>';
  return html;
}

/* --- شاشة إدارة المستخدمين (المدير فقط) --- */
function renderUserManagement() {
  var isAr = S.lang === 'ar';
  var ugSub = S.ugSub || 'pending'; /* pending / active / all */
  var ugSearch = S.ugSearch || '';
  var pendingCount = PENDING_USERS.length;
  var activeCount = USERS.filter(function(x){return x.status!=='pending'}).length;
  var totalCount = USERS.length;

  var html = '<div class="scr-hd"><div><h2>'+t('userManagement')+'</h2></div></div>';

  /* ===== بطاقات الإحصائيات ===== */
  html += '<div class="ug-stats ai">';
  html += '<div class="ug-stat"><div class="ug-stat-num ug-stat-clr-pri">'+totalCount+'</div><div class="ug-stat-lbl">'+t('ugStatTotal')+'</div></div>';
  html += '<div class="ug-stat"><div class="ug-stat-num ug-stat-clr-ok">'+activeCount+'</div><div class="ug-stat-lbl">'+t('ugStatActive')+'</div></div>';
  html += '<div class="ug-stat"><div class="ug-stat-num ug-stat-clr-warn">'+pendingCount+'</div><div class="ug-stat-lbl">'+t('ugStatPending')+'</div></div>';
  html += '</div>';

  /* ===== التبويبات ===== */
  html += '<div class="ug-tabs">';
  var tabs = [
    {id:'pending', icon:'clock', label:t('ugTabPending'), count:pendingCount},
    {id:'active', icon:'user-check', label:t('ugTabActive'), count:activeCount - (USERS.filter(function(x){return x.status!=='pending'&&x.role==='admin'}).length)},
    {id:'all', icon:'users', label:t('ugTabAll'), count:totalCount}
  ];
  tabs.forEach(function(tb) {
    var isActive = ugSub === tb.id;
    html += '<button class="ug-tab'+(isActive?' active':'')+'" data-act="ug-switch-tab" data-tab="'+tb.id+'">';
    html += '<i data-lucide="'+tb.icon+'"></i>';
    html += '<span>'+tb.label+'</span>';
    if(tb.count > 0) html += '<span class="ug-count">'+tb.count+'</span>';
    html += '</button>';
  });
  html += '</div>';

  /* ===== شريط البحث (للنشطين والجميع) ===== */
  if(ugSub !== 'pending') {
    html += '<div class="ug-search"><i data-lucide="search"></i><input type="text" id="ugSearchInput" placeholder="'+t('ugSearchUsers')+'" value="'+toEN(ugSearch)+'"></div>';
  }

  /* ===== محتوى التبويب: طلبات معلقة ===== */
  if(ugSub === 'pending') {
    if(pendingCount === 0) {
      html += '<div class="ug-empty"><i data-lucide="check-circle"></i><p>'+t('noPendingUsers')+'</p></div>';
    } else {
      PENDING_USERS.forEach(function(pu, idx) {
        var uName = isAr ? pu.name.ar : pu.name.en;
        var floorLabel = pu.floor ? flrName(pu.floor) : '-';
        var floorObj = FLOORS.find(function(f){return f.id===pu.floor});
        var floorClr = floorObj ? floorObj.clr : 'var(--mut)';
        html += '<div class="ug-card ai" style="animation-delay:'+idx*0.04+'s;border-right:4px solid var(--warn)">';
        html += '<div class="ug-avatar" style="background:'+(pu.clr||'var(--pri)')+'"><i data-lucide="user" style="width:20px;height:20px"></i></div>';
        html += '<div class="ug-info">';
        html += '<div class="ug-name">'+toEN(uName)+'<span class="ug-pending-badge" style="background:var(--warn-s);color:var(--warn)"><i data-lucide="clock" style="width:10px;height:10px"></i> '+t('pendingApproval')+'</span></div>';
        html += '<div class="ug-meta">';
        html += '<span>@'+pu.username+'</span>';
        html += '<span>·</span>';
        html += '<span>'+roleLabel(pu.role)+'</span>';
        if(pu.floor) { html += '<span>·</span><span class="ug-floor-tag" style="background:'+floorClr+'18;color:'+floorClr+'">'+floorLabel+'</span>'; }
        html += '</div>';
        if(pu.requestedAt) html += '<div class="ug-meta" style="margin-top:3px;font-size:.68rem;opacity:.7">'+toEN(pu.requestedAt)+'</div>';
        html += '</div>';
        html += '<div class="ug-actions">';
        html += '<button class="ug-btn ug-btn-ok" data-act="approve-user" data-uid="'+pu.id+'" title="'+t('approveUser')+'"><i data-lucide="check"></i></button>';
        html += '<button class="ug-btn ug-btn-err" data-act="reject-user" data-uid="'+pu.id+'" title="'+t('rejectUser')+'"><i data-lucide="x"></i></button>';
        html += '</div>';
        html += '</div>';
      });
    }
  }

  /* ===== محتوى التبويب: المستخدمين النشطين ===== */
  if(ugSub === 'active') {
    var actUsers = USERS.filter(function(x) { return x.status !== 'pending' && x.role !== 'admin'; });
    if(ugSearch) {
      var qRaw = ugSearch;
      var q = toEN(qRaw).toLowerCase();
      actUsers = actUsers.filter(function(u) {
        return (u.name.ar&&toEN(u.name.ar).toLowerCase().indexOf(q)!==-1) || (u.name.en&&u.name.en.toLowerCase().indexOf(q)!==-1) || toEN(u.username).toLowerCase().indexOf(q)!==-1;
      });
    }
    if(actUsers.length === 0) {
      html += '<div class="ug-empty"><i data-lucide="users"></i><p>'+(ugSearch?t('noData'):t('noData'))+'</p></div>';
    } else {
      actUsers.forEach(function(u, idx) {
        var uName = isAr ? u.name.ar : u.name.en;
        var floorLabel = u.floor ? flrName(u.floor) : '-';
        var floorObj = FLOORS.find(function(f){return f.id===u.floor});
        var floorClr = floorObj ? floorObj.clr : 'var(--mut)';
        var roleClr = u.role==='supervisor'?'var(--warn)':'var(--pri)';
        var roleBg = u.role==='supervisor'?'var(--warn-s)':'var(--pri-s)';
        html += '<div class="ug-card ai" style="animation-delay:'+idx*0.04+'s">';
        html += '<div class="ug-avatar" style="background:'+(u.clr||'var(--pri)')+'">'+(u.name.en?u.name.en[0]:'?')+'</div>';
        html += '<div class="ug-info">';
        html += '<div class="ug-name">'+toEN(uName)+'</div>';
        html += '<div class="ug-meta">';
        html += '<span>@'+u.username+'</span>';
        html += '<span>·</span>';
        html += '<span class="ug-role-tag" style="background:'+roleBg+';color:'+roleClr+'">'+roleLabel(u.role)+'</span>';
        if(u.floor) { html += '<span class="ug-floor-tag" style="background:'+floorClr+'18;color:'+floorClr+'">'+floorLabel+'</span>'; }
        html += '</div>';
        html += '</div>';
        html += '<div class="ug-actions">';
        html += '<button class="ug-btn ug-btn-pri" data-act="edit-user-role" data-uid="'+u.id+'" title="'+t('changeRole')+'"><i data-lucide="pencil"></i></button>';
        html += '<button class="ug-btn ug-btn-err" data-act="delete-user" data-uid="'+u.id+'" title="'+t('deleteUser')+'"><i data-lucide="trash-2"></i></button>';
        html += '</div>';
        html += '</div>';
      });
    }
  }

  /* ===== محتوى التبويب: جميع المستخدمين ===== */
  if(ugSub === 'all') {
    var allParts = USERS.filter(function(x) { return x.status !== 'pending'; });
    if(ugSearch) {
      var qRaw = ugSearch;
      var q = toEN(qRaw).toLowerCase();
      allParts = allParts.filter(function(u) {
        return (u.name.ar&&toEN(u.name.ar).toLowerCase().indexOf(q)!==-1) || (u.name.en&&u.name.en.toLowerCase().indexOf(q)!==-1) || toEN(u.username).toLowerCase().indexOf(q)!==-1;
      });
    }

    /* فلتر الأدوار */
    var partFilter = S.partFilter || 'all';
    var filteredParts = allParts;
    if(partFilter !== 'all') {
      filteredParts = allParts.filter(function(x) { return x.role === partFilter; });
    }

    var filterOpts = [
      {id:'all', label:t('filterAll'), count:allParts.length},
      {id:'admin', label:t('roleAdmin'), count:allParts.filter(function(x){return x.role==='admin'}).length},
      {id:'supervisor', label:t('roleSupervisor'), count:allParts.filter(function(x){return x.role==='supervisor'}).length},
      {id:'member', label:t('roleMember'), count:allParts.filter(function(x){return x.role==='member'}).length}
    ];
    html += '<div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px">';
    filterOpts.forEach(function(fo) {
      var isActive = partFilter === fo.id;
      var bg = isActive ? 'var(--pri)' : 'var(--card)';
      var fg = isActive ? '#fff' : 'var(--txt)';
      var bdr = isActive ? '1.5px solid var(--pri)' : '1.5px solid var(--bdr)';
      html += '<button data-act="filter-parts" data-role="'+fo.id+'" style="display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--rf);background:'+bg+';color:'+fg+';border:'+bdr+';font-size:.78rem;font-weight:600;white-space:nowrap;cursor:pointer;transition:all var(--tr);box-shadow:var(--sh-s)">';
      html += fo.label;
      html += '<span style="background:'+(isActive?'rgba(255,255,255,.25)':'var(--pri-s)')+';color:'+(isActive?'#fff':'var(--pri)')+';padding:1px 7px;border-radius:var(--rf);font-size:.68rem;font-weight:700">'+fo.count+'</span>';
      html += '</button>';
    });
    html += '</div>';

    if(filteredParts.length === 0) {
      html += '<div class="ug-empty"><i data-lucide="users"></i><p>'+t('noData')+'</p></div>';
    } else {
      var roleOrder = {admin:3, supervisor:2, member:1};
      filteredParts.forEach(function(u, idx) {
        var uName = isAr ? u.name.ar : u.name.en;
        var floorLabel = u.floor ? flrName(u.floor) : '-';
        var floorObj = FLOORS.find(function(f){return f.id===u.floor});
        var floorClr = floorObj ? floorObj.clr : 'var(--mut)';
        var currentOrder = roleOrder[u.role] || 0;
        var roleClrMap = {admin:'var(--err)',supervisor:'var(--warn)',member:'var(--pri)'};
        var roleBgMap = {admin:'var(--err-s)',supervisor:'var(--warn-s)',member:'var(--pri-s)'};
        html += '<div class="ug-card ai" style="animation-delay:'+idx*0.03+'s">';
        html += '<div class="ug-avatar" style="background:'+(u.clr||'var(--pri)')+'">'+(u.name.en?u.name.en[0]:'?')+'</div>';
        html += '<div class="ug-info">';
        html += '<div class="ug-name">'+toEN(uName)+(u.id===currentUser.id?' <span style="font-size:.68rem;color:var(--mut);font-weight:500">('+(isAr?'أنت':'You')+')</span>':'')+'</div>';
        html += '<div class="ug-meta">';
        html += '<span>@'+u.username+'</span>';
        html += '<span>·</span>';
        html += '<span class="ug-role-tag" style="background:'+(roleBgMap[u.role]||'var(--pri-s)')+';color:'+(roleClrMap[u.role]||'var(--pri)')+'">'+roleLabel(u.role)+'</span>';
        if(u.floor) { html += '<span class="ug-floor-tag" style="background:'+floorClr+'18;color:'+floorClr+'">'+floorLabel+'</span>'; }
        html += '</div>';
        html += '</div>';
        /* أزرار تغيير الدور */
        html += '<div class="ug-actions">';
        if(currentOrder < 3 && u.id !== currentUser.id) {
          var upRole = currentOrder < 2 ? 'supervisor' : 'admin';
          html += '<button class="ug-btn ug-btn-ok-up" data-act="promote-user" data-uid="'+u.id+'" data-newrole="'+upRole+'" title="'+t('promoteRole')+' → '+roleLabel(upRole)+'"><i data-lucide="chevron-up"></i></button>';
        }
        if(currentOrder > 1 && u.id !== currentUser.id) {
          var downRole = currentOrder > 2 ? 'supervisor' : 'member';
          html += '<button class="ug-btn ug-btn-warn" data-act="demote-user" data-uid="'+u.id+'" data-newrole="'+downRole+'" title="'+t('demoteRole')+' → '+roleLabel(downRole)+'"><i data-lucide="chevron-down"></i></button>';
        }
        if(u.id !== currentUser.id) {
          html += '<button class="ug-btn ug-btn-pri" data-act="edit-user-role" data-uid="'+u.id+'" title="'+t('changeRole')+'"><i data-lucide="pencil"></i></button>';
          html += '<button class="ug-btn ug-btn-err" data-act="delete-user" data-uid="'+u.id+'" title="'+t('deleteUser')+'"><i data-lucide="trash-2"></i></button>';
        }
        html += '</div>';
        html += '</div>';
      });
    }
  }

  return html;
}

/* --- شاشة التقارير --- */
function renderReports() {
  if(S.rptView) return renderReportDetail(S.rptView);
  var html = '<div class="scr-hd"><h2>'+t('reports')+'</h2></div>';
  /* بطاقات التقارير كأيقونات - تصفية حسب الصلاحيات */
  var allowedRpts = getAllowedReports();
  var brkCount = new Set(S.breaks.map(function(b){return b.pid})).size;
  var lvCount = new Set(S.leaves.filter(function(l){return l.status==='approved' && l.lvType !== 'rest'}).map(function(l){return l.pid})).size;
  var phCount = S.pharms.length;

  var allCards = [
    {id:'breaks', icon:'coffee', color:'#FF7043', label:t('breakReport'), count:brkCount, countLabel:t('totalBreaks')},
    {id:'leaves', icon:'calendar-off', color:'#7C4DFF', label:t('leaveReport'), count:lvCount, countLabel:t('totalLeaves')},
    {id:'pharm', icon:'users', color:'#1877F2', label:t('pharmReport'), count:phCount, countLabel:t('totalPharmacists')},
    {id:'schedules', icon:'calendar-days', color:'#43A047', label:t('scheduleReport'), count:0, countLabel:''}
  ];

  var cards = allCards.filter(function(c) { return allowedRpts.indexOf(c.id) !== -1; });

  /* بطاقة معلومات العضو - تظهر دائماً في الأعلى */
  if(isMember()) {
    var mPid = getMemberPid();
    if(mPid) {
      var mPharm = S.pharms.find(function(x){return x.id===mPid});
      if(mPharm) {
        var myLogCount = S.attendanceLog.filter(function(e){return e.pid===mPid}).length;
        var myRestCredits = (mPharm.restCredits || 0) + (mPharm.addedCredits || 0);
        /* حساب الإجازات */
        var myAllLeaves = S.leaves.filter(function(l){return l.pid===mPid});
        var myApprovedLeaves = myAllLeaves.filter(function(l){return l.status==='approved'});
        var myPendingLeaves = myAllLeaves.filter(function(l){return l.status==='pending'});
        var myRejectedLeaves = myAllLeaves.filter(function(l){return l.status==='rejected'});
        var myMonthLeaves = getMonthLeaves(mPid);
        var myRegularTaken = myApprovedLeaves.filter(function(l){return l.lvType==='regular'}).length;
        var mySickTaken = myApprovedLeaves.filter(function(l){return l.lvType==='sick'}).length;
        var myLongTaken = myApprovedLeaves.filter(function(l){return l.lvType==='long'}).length;
        var isAr = S.lang === 'ar';

        html += '<div style="margin-bottom:16px">';
        /* رصيد الاستراحات */
        html += '<button data-act="show-att-log" style="background:linear-gradient(135deg,var(--pri),#5B9BF7);border-radius:var(--rl);box-shadow:var(--sh-m);padding:16px;text-align:center;transition:all var(--tr);border:none;width:100%;cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:10px">';
        html += '<div style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i data-lucide="wallet" style="width:24px;height:24px"></i></div>';
        html += '<div style="text-align:start;flex:1">';
        html += '<div style="font-size:1.3rem;font-weight:800;color:#fff">'+myRestCredits+'</div>';
        html += '<div style="font-size:.76rem;color:rgba(255,255,255,.85);font-weight:500">'+t('restCredits')+' · '+myLogCount+' '+t('attLogDate')+'</div>';
        html += '</div>';
        html += '<i data-lucide="chevron-left" style="width:20px;height:20px;color:rgba(255,255,255,.6);flex-shrink:0"></i>';
        html += '</button>';

        /* بطاقة الإجازات */
        html += '<div style="background:var(--card);border-radius:var(--rl);box-shadow:var(--sh-m);padding:16px;margin-bottom:10px">';
        html += '<div style="font-size:.88rem;font-weight:700;color:var(--txt);margin-bottom:12px;display:flex;align-items:center;gap:8px"><i data-lucide="calendar-off" style="width:18px;height:18px;color:#7C4DFF"></i>'+t('myLeaves')+'</div>';

        /* إجازات الشهر */
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1.5px solid var(--bdr)">';
        html += '<span style="font-size:.82rem;color:var(--mut);font-weight:600">'+t('monthLeaves')+'</span>';
        var mClr = myMonthLeaves.length > 3 ? 'var(--err)' : 'var(--ok)';
        html += '<span style="font-size:.92rem;font-weight:700;color:'+mClr+'">'+myMonthLeaves.length+'/3</span>';
        html += '</div>';

        /* إجازات مقبولة */
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdr)">';
        html += '<span style="font-size:.8rem;color:var(--mut)">'+t('approved')+'</span>';
        html += '<span style="font-size:.85rem;font-weight:700;color:var(--ok)">'+myApprovedLeaves.length+'</span>';
        html += '</div>';

        /* إجازات قيد المراجعة */
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdr)">';
        html += '<span style="font-size:.8rem;color:var(--mut)">'+t('pending')+'</span>';
        html += '<span style="font-size:.85rem;font-weight:700;color:var(--warn)">'+myPendingLeaves.length+'</span>';
        html += '</div>';

        /* إجازات مرفوضة */
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdr)">';
        html += '<span style="font-size:.8rem;color:var(--mut)">'+t('rejected')+'</span>';
        html += '<span style="font-size:.85rem;font-weight:700;color:var(--err)">'+myRejectedLeaves.length+'</span>';
        html += '</div>';

        /* تفصيل الإجازات المقبولة */
        if(myApprovedLeaves.length > 0) {
          html += '<div style="margin-top:10px;padding-top:10px;border-top:1.5px solid var(--bdr)">';
          html += '<div style="font-size:.75rem;font-weight:700;color:var(--pri);margin-bottom:8px">'+t('totalTaken')+'</div>';
          if(myRegularTaken > 0) {
            html += '<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="font-size:.78rem;color:var(--mut)">'+t('lvTypeRegular')+'</span><span style="font-size:.82rem;font-weight:700;color:var(--txt)">'+myRegularTaken+'</span></div>';
          }
          if(mySickTaken > 0) {
            html += '<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="font-size:.78rem;color:var(--mut)">'+t('lvTypeSick')+'</span><span style="font-size:.82rem;font-weight:700;color:var(--txt)">'+mySickTaken+'</span></div>';
          }
          if(myLongTaken > 0) {
            html += '<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="font-size:.78rem;color:var(--mut)">'+t('lvTypeLong')+'</span><span style="font-size:.82rem;font-weight:700;color:var(--txt)">'+myLongTaken+'</span></div>';
          }
          html += '</div>';
        }
        html += '</div>';
        html += '</div>';
      }
    }
  }

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">';
  cards.forEach(function(c) {
    html += '<button data-act="open-rpt" data-rpt="'+c.id+'" style="background:var(--card);border-radius:var(--rl);box-shadow:var(--sh-m);padding:20px 10px;text-align:center;transition:all var(--tr);border:2px solid transparent;width:100%">';
    html += '<div style="width:52px;height:52px;border-radius:16px;background:'+c.color+'18;color:'+c.color+';display:flex;align-items:center;justify-content:center;margin:0 auto 10px"><i data-lucide="'+c.icon+'" style="width:26px;height:26px"></i></div>';
    if(c.countLabel) {
      html += '<div style="font-size:1.4rem;font-weight:700;color:'+c.color+';margin-bottom:4px">'+c.count+'</div>';
      html += '<div style="font-size:.72rem;color:var(--mut);font-weight:500;margin-bottom:6px">'+c.countLabel+'</div>';
    }
    html += '<div style="font-size:.85rem;font-weight:700;color:var(--txt)">'+c.label+'</div>';
    html += '</button>';
  });
  html += '</div>';
  return html;
}

      html += '</div>';
    } else {
      /* عرض جدول نوبة معينة */
      html += renderScheduleDetail(S.schedSub);
    }
  }
  return html;
}

/* --- دالة الحصول على تواريخ الأيام المختارة في شهر معين --- */
var DAY_NAMES_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var DAY_NAMES_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTH_NAMES_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var MONTH_NAMES_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MONTH_KEYS = ['monthJan','monthFeb','monthMar','monthApr','monthMay','monthJun','monthJul','monthAug','monthSep','monthOct','monthNov','monthDec'];

function getSchedDates(year, month, shift) {
  /* month: 0-indexed */
  /* shift: 'morning' = فقط الجمعة والسبت، 'evening'/'overnight' = جميع أيام الشهر */
  var dates = [];
  var addedDateStrs = new Set(); /* منع التكرار */
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var selectedDays = S.schedDays || [5, 6];
  var isAllDays = (shift === 'evening' || shift === 'overnight');
  /* إضافة الأيام */
  for(var d = 1; d <= daysInMonth; d++) {
    var dt = new Date(year, month, d);
    var day = dt.getDay();
    if(isAllDays || selectedDays.indexOf(day) !== -1) {
      var dayName = S.lang==='ar' ? DAY_NAMES_AR[day] : DAY_NAMES_EN[day];
      var dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      dates.push({date: dt, dateStr: dateStr, dayNum: day, dayName: dayName, isCustom: false});
      addedDateStrs.add(dateStr);
    }
  }
  /* إضافة التواريخ المخصصة التي أضافها المستخدم (فقط للصباحي) */
  if(!isAllDays) {
    var customDates = S.schedCustomDates || [];
    customDates.forEach(function(ds) {
      if(addedDateStrs.has(ds)) return; /* عدم التكرار */
      var cdt = new Date(ds);
      if(cdt.getFullYear() !== year || cdt.getMonth() !== month) return; /* فقط تواريخ الشهر الحالي */
      var cday = cdt.getDay();
      var cdayName = S.lang==='ar' ? DAY_NAMES_AR[cday] : DAY_NAMES_EN[cday];
      dates.push({date: cdt, dateStr: ds, dayNum: cday, dayName: cdayName, isCustom: true});
      addedDateStrs.add(ds);
    });
  }
  /* ترتيب حسب التاريخ */
  dates.sort(function(a, b) { return a.date - b.date; });
  return dates;
}

/* --- نافذة كالندر اختيار الشهر --- */
var _calYear;
function showSchedCalendar() {
  var now = new Date();
  _calYear = now.getFullYear();
  if(S.schedSelMonth) {
    var p = S.schedSelMonth.split('-');
    _calYear = parseInt(p[0]);
  }
  renderSchedCalendar();
}

function renderSchedCalendar() {
  var curYear = new Date().getFullYear();
  var curMonth = new Date().getMonth();
  var selMonthIdx = -1;
  if(S.schedSelMonth) {
    var sp = S.schedSelMonth.split('-');
    if(parseInt(sp[0]) === _calYear) selMonthIdx = parseInt(sp[1]) - 1;
  }
  var html = '<div class="m-title" style="margin-bottom:18px">'+t('selectMonth')+'</div>';
  /* التنقل بين السنوات */
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:0 4px">';
  html += '<button class="ibtn" data-mact="cal-prev-year" style="width:36px;height:36px;border-radius:10px"><i data-lucide="chevron-right" style="width:18px;height:18px"></i></button>';
  html += '<div style="font-size:1.15rem;font-weight:700;color:var(--txt)">'+_calYear+'</div>';
  html += '<button class="ibtn" data-mact="cal-next-year" style="width:36px;height:36px;border-radius:10px"><i data-lucide="chevron-left" style="width:18px;height:18px"></i></button>';
  html += '</div>';
  /* شبكة الأشهر */
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">';
  for(var mi = 0; mi < 12; mi++) {
    var mLabel = t(MONTH_KEYS[mi]);
    var isSelected = mi === selMonthIdx;
    var isCurrent = _calYear === curYear && mi === curMonth;
    var bg, fg, bdr;
    if(isSelected) {
      bg = 'var(--pri)'; fg = '#fff'; bdr = '2px solid var(--pri)';
    } else if(isCurrent) {
      bg = 'var(--pri-s)'; fg = 'var(--pri)'; bdr = '2px solid var(--pri)';
    } else {
      bg = 'var(--bg)'; fg = 'var(--txt)'; bdr = '2px solid transparent';
    }
    html += '<button data-mact="cal-select-month" data-month="'+mi+'" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:var(--r);background:'+bg+';color:'+fg+';border:'+bdr+';cursor:pointer;transition:all .15s;font-weight:600">';
    html += '<span style="font-size:.85rem;font-weight:700">'+mLabel+'</span>';
    html += '<span style="font-size:.7rem;opacity:.7">'+_calYear+'</span>';
    html += '</button>';
  }
  html += '</div>';
  /* زر الشهر الحالي */
  html += '<button data-mact="cal-today" style="width:100%;padding:10px;border-radius:var(--r);background:var(--bg);color:var(--pri);font-weight:600;font-size:.82rem;cursor:pointer;border:1.5px dashed var(--pri);margin-bottom:4px">'+t('selectMonth')+': '+t(MONTH_KEYS[curMonth])+' '+curYear+'</button>';
  showModal(html);
}

/* --- دالة عرض تفاصيل جدول نوبة معينة --- */
function renderScheduleDetail(shift) {
  var now = new Date();
  var selYear, selMonth;
  if(S.schedSelMonth) {

  } else {

  html += '<div style="flex:1;text-align:start"><div style="font-size:.72rem;color:var(--mut);font-weight:500">'+t('selectMonth')+'</div>';
  html += '<div style="font-size:.9rem;font-weight:700;color:var(--txt)">'+monthLabel+' '+selYear+'</div></div>';
  html += '<i data-lucide="chevron-down" style="width:16px;height:16px;color:var(--mut)"></i>';
  html += '</button></div>';

  /* أيام مختارة كشارات */
  var dayColors = {0:['#FDE8EC','#FA383E'],1:['#E7F3FF','#1877F2'],2:['#E6F9EE','#42B72A'],3:['#FFF8E1','#F7B928'],4:['#EDE7F6','#7C4DFF'],5:['#FFF8E1','#F7B928'],6:['#E7F3FF','#1877F2']};
  html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center">';
  if(shift === 'morning') {
    /* الجمعة والسبت كشارات ثابتة للصباحي */
    html += '<div style="display:flex;align-items:center;gap:4px;background:'+dayColors[5][0]+';border-radius:var(--rf);padding:5px 10px;font-size:.78rem;font-weight:600;color:'+dayColors[5][1]+'">';
    html += t('dayFri')+'</div>';
    html += '<div style="display:flex;align-items:center;gap:4px;background:'+dayColors[6][0]+';border-radius:var(--rf);padding:5px 10px;font-size:.78rem;font-weight:600;color:'+dayColors[6][1]+'">';
    html += t('daySat')+'</div>';
    /* التواريخ المخصصة كشارات قابلة للإزالة - فقط تواريخ الشهر المختار */
    var customDates = S.schedCustomDates || [];
    customDates.forEach(function(ds) {
      var cdt = new Date(ds);
      if(cdt.getFullYear() !== selYear || cdt.getMonth() !== selMonth) return;
      var cday = cdt.getDay();
      var dc = dayColors[cday] || ['#F0F2F5','#65676B'];
      var cdayName = S.lang==='ar' ? DAY_NAMES_AR[cday] : DAY_NAMES_EN[cday];
      html += '<div style="display:flex;align-items:center;gap:4px;background:'+dc[0]+';border-radius:var(--rf);padding:5px 10px;font-size:.78rem;font-weight:600;color:'+dc[1]+'">';
      html += cdayName + ' ' + cdt.getDate();
      if(isAdmin()) {
        html += '<button data-act="remove-sched-custom-date" data-date="'+ds+'" style="background:none;border:none;cursor:pointer;padding:0 2px;color:'+dc[1]+';display:flex;align-items:center;font-size:.85rem;line-height:1"><i data-lucide="x" style="width:12px;height:12px"></i></button>';
      }
      html += '</div>';
    });
    /* زر إضافة تاريخ محدد - فقط للمدير */
    if(isAdmin()) {
      html += '<div style="position:relative;display:flex;align-items:center;gap:4px">';
      html += '<input type="date" id="addSchedDateInp" style="width:0;height:0;opacity:0;position:absolute;pointer-events:none">';

      html += '</div>';
    }
  } else {
    /* الوسطي والمبيت: جميع أيام الشهر */
    html += '<div style="display:flex;align-items:center;gap:4px;background:var(--pri-s);border-radius:var(--rf);padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--pri)">';
    html += (S.lang==='ar'?'جميع الأيام':'All Days')+'</div>';
  }
  html += '</div>';

  /* شريط التنقل بين التواريخ */
  var schedDates = getSchedDates(selYear, selMonth, shift);
  if(schedDates.length > 0) {

    if(!S.schedSelectedDate || schedDates.findIndex(function(d){return d.dateStr===S.schedSelectedDate}) === -1) {
      S.schedSelectedDate = schedDates[0].dateStr;
    }
    html += '<div style="margin-bottom:10px">';
    html += '<div style="font-size:.76rem;font-weight:600;color:var(--mut);margin-bottom:6px">'+t('schedDateNav')+'</div>';
    html += '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch">';
    schedDates.forEach(function(dInfo) {
      var dc = dayColors[dInfo.dayNum] || ['#F0F2F5','#65676B'];
      var isActive = dInfo.dateStr === S.schedSelectedDate;
      var bg = isActive ? dc[1] : dc[0];
      var fg = isActive ? '#fff' : dc[1];
      var border = isActive ? '2px solid '+dc[1] : '2px solid transparent';
      html += '<button data-act="select-sched-date" data-date="'+dInfo.dateStr+'" style="display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;padding:8px 10px;border-radius:var(--r);background:'+bg+';color:'+fg+';border:'+border+';font-weight:600;transition:all .15s;cursor:pointer;flex-shrink:0">';
      html += '<span style="font-size:.72rem;font-weight:700">'+dInfo.dayName+'</span>';
      html += '<span style="font-size:.8rem;font-family:\'Noto Sans\',sans-serif">'+dInfo.date.getDate()+'</span>';
      html += '</button>';
    });
    html += '</div></div>';

  /* أزرار التصدير والطباعة - فقط للمدير */
  if(isAdmin()) {
    html += '<div class="flex gap-8 mb-12"><button class="btn btn-o btn-sm flex-1" data-act="export-sched" data-shift="'+shift+'"><i data-lucide="download"></i> '+t('export')+'</button>';
    html += '<button class="btn btn-o btn-sm flex-1" data-act="print-sched-filter" data-shift="'+shift+'"><i data-lucide="printer"></i> '+t('print')+'</button></div>';
  }

  /* الجدول للتاريخ المختار */
  html += '<div id="schedTable">';
  html += buildScheduleTable(shift, selYear, selMonth, S.schedSelectedDate);
  html += '</div>';
  return html;
}

/* --- بناء جدول الجدول حسب النوبة والشهر والتاريخ --- */
function buildScheduleTable(shift, year, month, dateStr) {
  var floors;
  if(shift === 'morning') { floors = FLOORS; }
  else if(shift === 'evening') { floors = EVENING_FLOORS; }
  else { floors = OVERNIGHT_FLOORS; }

  var schedRows = getSchedRowsForDate(shift, dateStr);
  var isViewOnly = isSupervisor() || isMember(); /* المسؤول والعضو: عرض فقط بدون تعديل */

  var html = '';

  /* عرض التاريخ المختار */
  if(dateStr) {
    var dt = new Date(dateStr);
    var dayIdx = dt.getDay();
    var dc = {0:['#FDE8EC','#FA383E'],1:['#E7F3FF','#1877F2'],2:['#E6F9EE','#42B72A'],3:['#FFF8E1','#F7B928'],4:['#EDE7F6','#7C4DFF'],5:['#FFF8E1','#F7B928'],6:['#E7F3FF','#1877F2']};
    var dayDC = dc[dayIdx] || ['#F0F2F5','#65676B'];
    var dayN = S.lang==='ar' ? DAY_NAMES_AR[dayIdx] : DAY_NAMES_EN[dayIdx];
    html += '<div style="background:'+dayDC[0]+';border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px">';
    html += '<div style="width:36px;height:36px;border-radius:10px;background:'+dayDC[1]+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;font-family:\'Noto Sans\',sans-serif">'+dt.getDate()+'</div>';
    html += '<div><div style="font-weight:700;font-size:.88rem;color:'+dayDC[1]+'">'+dayN+'</div>';
    html += '<div style="font-size:.72rem;color:'+dayDC[1]+';opacity:.8">'+fmtPrintDate(dt)+'</div></div>';
    html += '</div>';
  }

  /* عرض الجدول مقسم الى طوابق مثل الحضور مع حقول إدخال */
  var hasAny = false;
  floors.forEach(function(f) {
    if(!schedRows[f.id]) schedRows[f.id] = [null];
    var floorRows = schedRows[f.id];
    var fc = floorRows.filter(Boolean).length;
    hasAny = true;

    html += '<div class="flr-sec ai">';
    /* رأس الطابق */
    html += '<div class="flr-hd">';
    html += '<div class="flr-ico" style="background:'+(f.clr||'var(--pri)')+'18;color:'+(f.clr||'var(--pri)')+'"><i data-lucide="'+(f.icon||'layers')+'"></i></div>';
    html += '<span class="flr-nm">'+toEN(S.lang==='ar'?f.ar:f.en)+'</span>';
    html += '<span style="font-size:.72rem;color:var(--mut)">'+fc+'/'+floorRows.length+'</span>';
    html += '</div>';

    /* صفوف الجدول */
    if(isViewOnly) {
      /* المسؤول: عرض فقط بدون حقول إدخال أو أزرار حذف/إضافة */
      html += '<div class="flr-rows" style="padding:6px 10px 2px">';
      floorRows.forEach(function(pid, idx) {
        if(!pid) return;
        var p = S.pharms.find(function(x){return x.id===pid});
        if(!p) return;
        html += '<div class="ph-row ai" style="padding:8px 10px;margin-bottom:4px;cursor:pointer" data-act="pharm-detail" data-pid="'+p.id+'">';
        html += '<div class="ph-av" style="background:'+p.clr+';width:30px;height:30px;font-size:.7rem">'+p.en[0]+'</div>';
        html += '<div class="ph-inf"><div class="ph-nm" style="font-size:.84rem">'+phName(p)+'</div>';
        html += '<div class="ph-id">'+p.id+'</div></div>';
        html += '</div>';
      });
      html += '</div>';
    } else {
      /* المدير: عرض مع حقول إدخال وأزرار تعديل */
      html += '<div class="flr-rows">';
      floorRows.forEach(function(pid, idx) {
        var p = pid ? S.pharms.find(function(x){return x.id===pid}) : null;
        html += '<div class="att-row"><div class="iwrap">';
        html += '<input type="text" class="sched-in '+(p?'filled':'')+'" placeholder="'+t('nameOrId')+'" data-fl="'+f.id+'" data-idx="'+idx+'" data-sh="'+shift+'" data-dt="'+(dateStr||'')+'" value="'+(p?phName(p):'')+'" '+(p?'readonly':'')+'></div>';
        if(p) {
          html += '<button class="btn-clr" data-act="clr-sched-row" data-fl="'+f.id+'" data-idx="'+idx+'" data-sh="'+shift+'" data-dt="'+(dateStr||'')+'" title="'+t('clearValue')+'"><i data-lucide="x"></i></button>';
        }
        html += '<button class="btn-del-row" data-act="del-sched-row" data-fl="'+f.id+'" data-idx="'+idx+'" data-sh="'+shift+'" data-dt="'+(dateStr||'')+'" title="'+t('deleteRow')+'"><i data-lucide="trash-2"></i></button>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="flr-actions">';
      html += '<button class="btn-add" data-act="add-sched-row" data-fl="'+f.id+'" data-sh="'+shift+'" data-dt="'+(dateStr||'')+'"><i data-lucide="plus"></i> '+t('addRow')+'</button>';
      html += '</div>';
    }
    html += '</div>';
  });

  if(!hasAny) {
    html += '<div class="empty"><i data-lucide="calendar"></i><p>'+t('noData')+'</p></div>';
  }

  /* حفظ البيانات المحدثة */
  setSchedRowsForDate(shift, dateStr, schedRows);

  return html;
}

/* --- دالة الحصول على صفوف الجدول لتاريخ محدد --- */
function getSchedRowsForDate(shift, dateStr) {
  var allRows = shift==='morning' ? S.schedMRows : shift==='evening' ? S.schedERows : S.schedORows;
  if(!dateStr) return {};
  if(!allRows[dateStr]) allRows[dateStr] = {};
  return allRows[dateStr];
}

/* --- دالة حفظ صفوف الجدول لتاريخ محدد --- */
function setSchedRowsForDate(shift, dateStr, rows) {
  var allRows = shift==='morning' ? S.schedMRows : shift==='evening' ? S.schedERows : S.schedORows;
  if(!dateStr) return;
  allRows[dateStr] = rows;
}

/* --- دالة الحصول على الأعمدة المختارة في تقرير الصيادلة --- */
function getPharmSelectedCols() {
  var checks = document.querySelectorAll('.ph-col-chk');
  var cols = [];
  checks.forEach(function(chk) { if(chk.checked) cols.push(chk.value); });
  /* الاسم دائماً مختار كحد أدنى */
  if(cols.length === 0) cols.push('name');
  return cols;
}

      else if(c==='floor') html += '<td>'+flrName(p.fl)+'</td>';
      else if(c==='phone') html += '<td style="font-family:\'Noto Sans\',sans-serif;font-size:.82rem">'+(p.phone?toEN(p.phone):'')+'</td>';

function buildPharmExportData(cols) {
  if(!cols) cols = getPharmSelectedCols();
  var headers = [];
  cols.forEach(function(c) {
    if(c==='name') headers.push(t('colName'));
    else if(c==='idCode') headers.push(t('colIdCode'));
    else if(c==='category') headers.push(t('colCategory'));
    else if(c==='floor') headers.push(t('colFloor'));
    else if(c==='phone') headers.push(t('colPhone'));
    else if(c==='restCredits') headers.push(t('colRestCredits'));
  });
  var data = S.pharms.map(function(p) {
    var catLabel = p.cat==='practicing'?t('catPracticing'):p.cat==='exempt'?t('catExempt'):p.cat==='trainee'?t('catTrainee'):'';
    var row = [];
    cols.forEach(function(c) {
      if(c==='name') row.push(phName(p));

function renderBreaksReportFiltered() {

  /* قراءة الأعمدة المختارة */
  var checks = document.querySelectorAll('.brk-col-chk');
  var selCols = [];
  if(checks.length > 0) {
    checks.forEach(function(chk) { if(chk.checked) selCols.push(chk.value); });
  }
  if(selCols.length === 0) selCols = ['name','breakDate','attDate'];

  /* جمع بيانات الاستراحات المعتمدة فقط مع معلومات الصيدلي وتاريخ الحضور */
  var allBreaks = [];
  S.breaks.forEach(function(b) {
    var p = S.pharms.find(function(x){return x.id===b.pid});
    if(!p) return;
    /* التحقق من أن الاستراحة معتمدة — إما لا يوجد طلب إجازة مطابق (استراحة حية) أو الطلب موافق عليه */
    var matchingLeave = S.leaves.find(function(l) { return l.pid === b.pid && l.date === b.dateStr && l.lvType === 'rest'; });
    if(matchingLeave && matchingLeave.status !== 'approved') return;
    allBreaks.push({
      id: b.id, pid: b.pid, name: phName(p),
      floor: b.fl || p.fl, breakDate: b.dateStr || '',
      attDate: b.attDate || null, shift: b.shift || ''
    });
  });

  /* ترتيب تنازلي حسب تاريخ الاستراحة */
  allBreaks.sort(function(a,b){ return (b.breakDate || '').localeCompare(a.breakDate || '') || b.id - a.id; });

  if(allBreaks.length === 0) {
    return '<div class="empty mb-16"><i data-lucide="coffee"></i><p>'+t('noBreaksForDate')+'</p></div>';
  }

  var isAr = S.lang === 'ar';
  var shiftLabels = {morning: t('attLogMorning'), evening: t('attLogEvening'), overnight: t('attLogOvernight'), '': '—'};
  var shiftColors = {morning: '#F7B928', evening: '#7C4DFF', overnight: '#1877F2', '': 'var(--mut)'};

  var html = '';

  html += '<div style="overflow-x:auto;margin-bottom:12px">';
  html += '<table class="rpt-tbl mb-12"><thead><tr>';
  selCols.forEach(function(c) {
    if(c==='num') html += '<th>#</th>';
    else if(c==='name') html += '<th>'+t('name')+'</th>';
    else if(c==='idCode') html += '<th>'+t('idCode')+'</th>';
    else if(c==='shift') html += '<th>'+t('brkFilterShift')+'</th>';
    else if(c==='breakDate') html += '<th>'+t('breakDate')+'</th>';
    else if(c==='attDate') html += '<th>'+t('attDate')+'</th>';
    else if(c==='floor') html += '<th>'+t('brkFilterFloor')+'</th>';
  });
  html += '</tr></thead><tbody>';

  /* بناء الصفوف حسب الأعمدة المختارة */
  allBreaks.forEach(function(b, i) {
    var breakDateObj = b.breakDate ? new Date(b.breakDate + 'T00:00:00') : null;
    var breakDateLabel = breakDateObj ? breakDateObj.getFullYear() + '/' + String(breakDateObj.getMonth()+1).padStart(2,'0') + '/' + String(breakDateObj.getDate()).padStart(2,'0') : '—';
    var attDateObj = b.attDate ? new Date(b.attDate + 'T00:00:00') : null;
    var attDateLabel = attDateObj ? attDateObj.getFullYear() + '/' + String(attDateObj.getMonth()+1).padStart(2,'0') + '/' + String(attDateObj.getDate()).padStart(2,'0') : '<span style="color:var(--mut)">—</span>';
    var shColor = shiftColors[b.shift] || 'var(--mut)';

    html += '<tr>';

      if(c==='num') {
        html += '<td style="font-family:\'Noto Sans\',sans-serif;text-align:center;font-weight:600;color:var(--mut)">'+(i+1)+'</td>';
      } else if(c==='name') {

      } else if(c==='idCode') {

        html += '<td><span style="display:inline-block;background:'+shColor+'18;color:'+shColor+';font-weight:700;font-size:.75rem;padding:2px 8px;border-radius:6px">'+shLabel+'</span></td>';
      } else if(c==='breakDate') {

      } else if(c==='attDate') {

/* --- عرض تقرير الإجازات حسب التاريخ والنوع --- */
function renderLeavesReport(fromDate, toDate, lvType) {
  var filtered = S.leaves.filter(function(l){return l.status==='approved' && l.lvType !== 'rest'}).filter(function(l) {
    var ld = l.date;
    var inRange = ld >= fromDate && ld <= toDate;
    var matchType = (lvType === 'all') || ((l.lvType||'regular') === lvType);
    if(!inRange || !matchType) return false;
    return true;
  });
  if(filtered.length === 0) {
    return '<div class="empty mb-16"><i data-lucide="calendar-off"></i><p>'+t('noLeavesForDate')+'</p></div>';
  }
  /* تجميع الإجازات حسب الصيدلي ونوع الإجازة */
  var grouped = {};
  filtered.forEach(function(l) {
    var key = l.pid + '_' + (l.lvType||'regular');
    if(!grouped[key]) {
      grouped[key] = {pid: l.pid, lvType: l.lvType||'regular', records: [], minDate: l.date, maxDate: l.dateEnd||l.date};
    }
    grouped[key].records.push(l);
    if(l.date < grouped[key].minDate) grouped[key].minDate = l.date;
    var lEnd = l.dateEnd || l.date;
    if(lEnd > grouped[key].maxDate) grouped[key].maxDate = lEnd;
  });
  var groups = Object.keys(grouped).map(function(k){return grouped[k]});
  var html = '<table class="rpt-tbl mb-12"><thead><tr><th>'+t('name')+'</th><th>'+t('idCode')+'</th><th>'+t('leaveType')+'</th><th>'+t('numDays')+'</th><th>'+t('fromDate')+'</th><th>'+t('toDate')+'</th></tr></thead><tbody>';
  groups.forEach(function(g) {
    var p = S.pharms.find(function(x){return x.id===g.pid});
    var numDays = Math.round((new Date(g.maxDate) - new Date(g.minDate)) / (1000*60*60*24)) + 1;
    var lvTypeLabel = t('lvType'+g.lvType.charAt(0).toUpperCase()+g.lvType.slice(1));
    html += '<tr><td>'+(p?phName(p):g.pid)+'</td><td style="font-family:\'Noto Sans\',sans-serif">'+g.pid+'</td><td>'+lvTypeLabel+'</td><td style="font-family:\'Noto Sans\',sans-serif;text-align:center">'+numDays+'</td><td>'+toEN(g.minDate)+'</td><td>'+toEN(g.maxDate)+'</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="flex gap-8 mb-16"><button class="btn btn-o btn-sm flex-1" data-act="export-lvr" data-from="'+fromDate+'" data-to="'+toDate+'" data-lvtype="'+lvType+'"><i data-lucide="download"></i> '+t('export')+'</button>';
  html += '<button class="btn btn-o btn-sm flex-1" data-act="print-lvr" data-from="'+fromDate+'" data-to="'+toDate+'" data-lvtype="'+lvType+'"><i data-lucide="printer"></i> '+t('print')+'</button></div>';
  return html;
}

/* ========== الإكمال التلقائي ========== */
function showAC(input) {
  var fl = input.dataset.fl;
  var idx = +input.dataset.idx;
  var sh = input.dataset.sh;
  var dt = input.dataset.dt || '';
  var isSched = input.classList.contains('sched-in');
  S.activeInput = {fl: fl, idx: idx, sh: sh, dt: dt, isSched: isSched};
  var q = input.value.trim().toLowerCase();
  var qEN = toEN(q).toLowerCase();
  if(!q && !qEN) { closeAC(); return; }
  var used;
  if(isSched) {
    /* في الجدول: منع تكرار الصيدلي في نفس التاريخ فقط */
    var schedRows = getSchedRowsForDate(sh, dt);
    used = new Set();
    Object.keys(schedRows).forEach(function(k) {
      schedRows[k].forEach(function(id) { if(id) used.add(id); });
    });
  } else {
    /* للحضور: استخدام المعينين في التاريخ المحدد */
    if(dt) {
      used = new Set();
      var dtRows = getAttEditRows(sh, dt);
      Object.keys(dtRows).forEach(function(k) {
        if(Array.isArray(dtRows[k])) dtRows[k].forEach(function(id) { if(id) used.add(id); });
      });
    } else {
      used = assignedIds(sh);
    }
  }
  var results = S.pharms.filter(function(p) {
    /* البحث بالاسم الانكليزي أو العربي أو الكود (يدعم الارقام العربية والانكليزية) */
    var idEN = p.id.toLowerCase();
    var idAR = idEN.replace(/[0-9]/g, function(c){return String.fromCharCode(c.charCodeAt(0)+0x0660-48)});
    return !used.has(p.id) && (p.en.toLowerCase().indexOf(qEN) !== -1 || p.ar.indexOf(q) !== -1 || idEN.indexOf(qEN) !== -1 || idAR.indexOf(q) !== -1);
  });
  if(!results.length) { closeAC(); return; }
  var ac = document.getElementById('autocomplete');
  var h = '';
  results.forEach(function(p) {
    h += '<div class="ac-item" data-pid="'+p.id+'"><div class="ac-avatar" style="background:'+p.clr+'">'+p.en[0]+'</div>';
    h += '<div class="ac-info"><div class="ac-name">'+phName(p)+'</div><div class="ac-id">'+p.id+' · '+flrName(p.fl)+'</div></div></div>';
  });
  ac.innerHTML = h;
  var rect = input.getBoundingClientRect();
  ac.style.top = (rect.bottom + 4) + 'px';
  ac.style.left = Math.max(8, rect.left) + 'px';
  ac.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
  ac.classList.add('show');
}
function closeAC() {
  document.getElementById('autocomplete').classList.remove('show');
  S.activeInput = null;
}
function selectPharma(pid) {
  if(!S.activeInput) return;
  var fl = S.activeInput.fl;
  var idx = S.activeInput.idx;
  var sh = S.activeInput.sh;
  var dt = S.activeInput.dt || '';
  var today = todayStr();
  /* تحديد مصدر البيانات حسب التاريخ */
  var rows = getAttEditRows(sh, dt);
  if(!rows[fl]) rows[fl] = [];
  rows[fl][idx] = pid;
  /* إضافة رصيد استراحات: صباحي +١، وسطي/مبيت +٢ */
  var p = S.pharms.find(function(x){return x.id===pid});
  if(p) {
    var credits = sh === 'morning' ? 1 : 2;
    p.restCredits = (p.restCredits || 0) + credits;
    /* حفظ تاريخ الحضور في سجل الأيام */
    var attDate = dt || today;
    S.attendanceLog.push({
      id: Date.now(),
      pid: pid,
      date: attDate,
      shift: sh,
      credits: credits,
      floor: fl
    });
  }
  /* تحديث بيانات الجدول أيضاً */
  var schedDate = dt || today;
  var schedRows = getSchedRowsForDate(sh, schedDate);
  if(!schedRows[fl]) schedRows[fl] = [];
  /* التحقق من عدم وجود الصيدلي مسبقاً في نفس الطابق */
  var existsInSched = schedRows[fl].indexOf(pid) !== -1;
  if(!existsInSched) {
    var emptyIdx = schedRows[fl].indexOf(null);
    if(emptyIdx !== -1) {
      schedRows[fl][emptyIdx] = pid;
    } else {
      schedRows[fl].push(pid);
    }
    setSchedRowsForDate(sh, schedDate, schedRows);
  }
  /* حفظ في السجل */
  if(!dt || dt === today) {
    saveCurrentAttToHistory();
  }
  closeAC();
  renderScreen();
}

/* ========== تحديد صيدلي في الجدول (بدون احتساب استراحات) ========== */
function selectSchedPharma(pid) {
  if(!S.activeInput) return;
  var fl = S.activeInput.fl;
  var idx = S.activeInput.idx;
  var sh = S.activeInput.sh;
  var dt = S.activeInput.dt || S.schedSelectedDate || '';

  schedRows[fl][idx] = pid;
  setSchedRowsForDate(sh, dt, schedRows);

  /* تحديث الجدول فقط بدلاً من إعادة رسم الشاشة بالكامل */
  var container = document.getElementById('schedTable');

      if(!_selectedLvPharmId) { if(restInfoDiv) restInfoDiv.style.display='none'; return; }
      var p = S.pharms.find(function(x){return x.id===_selectedLvPharmId});
      var credits = p ? ((p.restCredits || 0) + (p.addedCredits || 0)) : 0;
      if(restInfoDiv) {
        restInfoDiv.style.display = 'block';
        var clr = credits > 0 ? 'var(--ok)' : 'var(--err)';
        var bg = credits > 0 ? 'var(--ok-s)' : 'var(--err-s)';
        restInfoDiv.style.background = bg;
        restInfoDiv.style.color = clr;
        restInfoDiv.textContent = t('restCredits') + ': ' + credits;
      }
    }

    /* أحداث اختيار نوع الإجازة */
    document.querySelectorAll('.lv-type-opt').forEach(function(lbl) {
      lbl.addEventListener('click', function() {
        /* إزالة التحديد من الكل */
        document.querySelectorAll('.lv-type-opt').forEach(function(l) {
          l.style.borderColor = 'transparent';
          l.style.background = 'var(--bg)';
        });
        /* تحديد الحالي */
        this.style.borderColor = 'var(--pri)';
        this.style.background = 'var(--pri-s)';
        this.querySelector('input').checked = true;
        var lvType = this.dataset.lvtype;
        /* إظهار/إخفاء حقول التاريخ والنوبة */
        if(lvType === 'sick' || lvType === 'long') {
          if(singleDateDiv) singleDateDiv.style.display = 'none';
          if(rangeDateDiv) rangeDateDiv.style.display = 'block';
          if(restInfoDiv) restInfoDiv.style.display = 'none';
        } else if(lvType === 'rest') {
          if(singleDateDiv) singleDateDiv.style.display = 'block';
          if(rangeDateDiv) rangeDateDiv.style.display = 'none';
          updateRestInfo();
        } else if(lvType === 'regular') {
          if(singleDateDiv) singleDateDiv.style.display = 'none';
          if(rangeDateDiv) rangeDateDiv.style.display = 'block';
          if(restInfoDiv) restInfoDiv.style.display = 'none';
        } else {
          if(singleDateDiv) singleDateDiv.style.display = 'none';
          if(rangeDateDiv) rangeDateDiv.style.display = 'block';
          if(restInfoDiv) restInfoDiv.style.display = 'none';
        }
      });
    });

    if(searchInput) {
      searchInput.addEventListener('input', function() {
        var qRaw = this.value.trim();
        var q = toEN(qRaw).toLowerCase();
        if(!q) { searchList.classList.remove('show'); searchList.innerHTML=''; return; }
        var results = S.pharms.filter(function(p) {
          /* المسؤول: فقط صيادلة طابقه حصراً - لا يرى صيادلة الطوابق الأخرى أبداً */
          if(isSupervisor()) {
            var myFloor = currentUser ? currentUser.floor : null;
            if(!myFloor || p.fl !== myFloor) return false;
          }
          /* البحث بالاسم أو الكود (يدعم الارقام العربية والانكليزية) */
          var idEN = p.id.toLowerCase();
          var idAR = idEN.replace(/[0-9]/g, function(c){return String.fromCharCode(c.charCodeAt(0)+0x0660-48)});
          return p.en.toLowerCase().indexOf(q) !== -1 || p.ar.indexOf(qRaw) !== -1 || idEN.indexOf(q) !== -1 || idAR.indexOf(qRaw) !== -1;
        });
        if(!results.length) { searchList.classList.remove('show'); searchList.innerHTML=''; return; }
        var h = '';
        results.forEach(function(p) {
          h += '<div class="lv-sl-item" data-pid="'+p.id+'"><div class="ac-avatar" style="background:'+p.clr+'">'+p.en[0]+'</div>';
          h += '<div class="ac-info"><div class="ac-name">'+phName(p)+'</div><div class="ac-id">'+p.id+' · '+flrName(p.fl)+'</div></div></div>';
        });
        searchList.innerHTML = h;
        searchList.classList.add('show');
      });
      searchInput.addEventListener('focus', function() { if(this.value.trim()) this.dispatchEvent(new Event('input')); });
    }
    if(searchList) {
      searchList.addEventListener('click', function(e) {
        var item = e.target.closest('.lv-sl-item');
        if(!item) return;
        var pid = item.dataset.pid;
        var p = S.pharms.find(function(x){return x.id===pid});
        if(p) {
          _selectedLvPharmId = pid;
          if(selInfo) selInfo.textContent = phName(p) + ' (' + p.id + ')';
          if(selectedDiv) selectedDiv.style.display = 'flex';
          if(searchInput) searchInput.value = '';
          searchList.classList.remove('show');
          searchList.innerHTML = '';
          updateRestInfo();
        }
      });
    }
    if(clearBtn) {
      clearBtn.addEventListener('click', function() {
        _selectedLvPharmId = null;
        if(selectedDiv) selectedDiv.style.display = 'none';
        if(restInfoDiv) restInfoDiv.style.display = 'none';
      });
    }
  }, 100);
}

function showSwapPharmModal(pid, flId, shift) {
  var p = S.pharms.find(function(x){return x.id===pid});

  var html = '<div class="m-title">'+t('swapPharmacist')+'</div>';
  html += '<div style="text-align:center;margin-bottom:14px"><div class="ph-av" style="background:'+p.clr+';width:48px;height:48px;font-size:1.1rem;border-radius:14px;margin:0 auto 8px">'+p.en[0]+'</div>';

  html += '<div class="fg"><label class="fl">'+t('replaceWith')+'</label>';
  html += '<div class="sw"><select class="fsel" id="swapTarget">';
  html += '<option value="" disabled selected>'+t('selectPharmacist')+'</option>';
  /* عرض الصيادلة غير المضافين في نفس التاريخ */
  var dt = S.schedSelectedDate || '';
  var schedRows = getSchedRowsForDate(shift, dt);
  var assignedSet = new Set();
  Object.keys(schedRows).forEach(function(k) { schedRows[k].forEach(function(id) { if(id) assignedSet.add(id); }); });
  S.pharms.forEach(function(ph) {
    if(ph.id !== pid) {
      var isAssigned = assignedSet.has(ph.id);
      html += '<option value="'+ph.id+'">'+phName(ph)+' ('+ph.id+')'+(isAssigned?' - '+flrName(ph.fl):'')+'</option>';
    }
  });
  html += '</select></div></div>';
  html += '<div class="flex gap-8 mt-12"><button class="btn btn-o flex-1" data-mact="close-modal">'+t('cancel')+'</button>';
  html += '<button class="btn btn-p flex-1" data-mact="do-swap-pharm" data-pid="'+pid+'" data-fl="'+flId+'" data-shift="'+shift+'">'+t('confirm')+'</button></div>';
  showModal(html);
}

function doSwapPharm(pid, flId, shift) {
  var sel = document.getElementById('swapTarget');
  if(!sel || !sel.value) { toast(t('selectPharmacist'), 'warning'); return; }
  var newPid = sel.value;
  var dt = S.schedSelectedDate || '';
  var schedRows = getSchedRowsForDate(shift, dt);
  if(!schedRows[flId]) return;
  var idx = schedRows[flId].indexOf(pid);
  if(idx === -1) return;
  schedRows[flId][idx] = newPid;
  setSchedRowsForDate(shift, dt, schedRows);
  hideModal();
  toast(t('swapDone'), 'success');
  /* تحديث الجدول */
  var container = document.getElementById('schedTable');
  var now3 = new Date();
  var sY = now3.getFullYear(), sM = now3.getMonth();
  if(S.schedSelMonth) { var sp3 = S.schedSelMonth.split('-'); sY = parseInt(sp3[0]); sM = parseInt(sp3[1]) - 1; }
  if(container) {
    container.innerHTML = buildScheduleTable(shift, sY, sM, S.schedSelectedDate);
    lucide.createIcons({nodes:[container]});
  }
}

function showAddDayModal() {
  var now = new Date();
  var year = now.getFullYear(), month = now.getMonth();
  if(S.schedSelMonth) {
    var mParts = S.schedSelMonth.split('-');
    year = parseInt(mParts[0]); month = parseInt(mParts[1]) - 1;
  }
  var monthVal = year+'-'+String(month+1).padStart(2,'0');

  var html = '<div class="m-title">'+t('addDay')+'</div>';
  html += '<div class="fg"><label class="fl">'+t('selectDayToAdd')+'</label>';
  html += '<input class="finp" type="date" id="addSchedDateVal" min="'+year+'-'+String(month+1).padStart(2,'0')+'-01" max="'+year+'-'+String(month+2).padStart(2,'0')+'-0" value="" style="padding:8px 10px;font-size:.85rem"></div>';
  html += '<div id="addSchedDatePreview" style="padding:10px 14px;background:var(--bg);border-radius:var(--r);margin-bottom:10px;font-size:.82rem;color:var(--mut);text-align:center">'+t('selectDayToAdd')+'</div>';
  html += '<div class="flex gap-8 mt-12"><button class="btn btn-o flex-1" data-mact="close-modal">'+t('cancel')+'</button>';
  html += '<button class="btn btn-p flex-1" data-mact="do-add-sched-date">'+t('confirm')+'</button></div>';
  showModal(html);
  /* معاينة التاريخ المختار */
  setTimeout(function() {
    var dateInp = document.getElementById('addSchedDateVal');
    var preview = document.getElementById('addSchedDatePreview');
    if(dateInp && preview) {
      dateInp.addEventListener('change', function() {
        if(!this.value) { preview.textContent = t('selectDayToAdd'); return; }
        var d = new Date(this.value);
        var dayIdx = d.getDay();
        var dayN = S.lang==='ar' ? DAY_NAMES_AR[dayIdx] : DAY_NAMES_EN[dayIdx];
        var dc = {0:['#FDE8EC','#FA383E'],1:['#E7F3FF','#1877F2'],2:['#E6F9EE','#42B72A'],3:['#FFF8E1','#F7B928'],4:['#EDE7F6','#7C4DFF'],5:['#FFF8E1','#F7B928'],6:['#E7F3FF','#1877F2']};
        var c = dc[dayIdx] || ['#F0F2F5','#65676B'];
        /* التحقق من عدم التكرار */
        var customDates = S.schedCustomDates || [];
        var isDuplicate = customDates.indexOf(this.value) !== -1;
        var isFriSat = dayIdx === 5 || dayIdx === 6;
        var warning = '';
        if(isFriSat) warning = ' <span style="color:var(--warn)">('+(S.lang==='ar'?'مضاف تلقائياً':'Auto-included')+'</span>)';
        if(isDuplicate) warning = ' <span style="color:var(--err)">('+(S.lang==='ar'?'مضاف مسبقاً':'Already added')+'</span>)';
        preview.innerHTML = '<span style="color:'+c[1]+';font-weight:700">'+dayN+' '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+'</span>'+warning;
        preview.style.background = c[0];
      });
    }
  }, 100);
}

/* ========== طباعة الجدول مباشرة بدون تصفية ========== */
function doPrintSchedDirect(shift) {
  var now = new Date();
  var year = now.getFullYear(), month = now.getMonth();
  if(S.schedSelMonth) {
    var mParts = S.schedSelMonth.split('-');
    year = parseInt(mParts[0]); month = parseInt(mParts[1]) - 1;
  }
  var floors;
  if(shift === 'morning') { floors = FLOORS; }
  else if(shift === 'evening') { floors = EVENING_FLOORS; }
  else { floors = OVERNIGHT_FLOORS; }

  var allRows = shift==='morning' ? S.schedMRows : shift==='evening' ? S.schedERows : S.schedORows;
  var schedDates = getSchedDates(year, month, shift);

  var headers = [t('dayName'), t('date'), t('floor'), t('colName'), t('idCode'), t('colCategory')];
  var data = [];
  schedDates.forEach(function(dInfo) {
    var dayLabel = dInfo.dayName;
    var dateLabel = fmtPrintDate(dInfo.date);
    var dateRows = allRows[dInfo.dateStr];
    if(!dateRows) {
      /* لا توجد بيانات لهذا التاريخ - نضيف صف فارغ بالتاريخ فقط */
      data.push([dayLabel, dateLabel, '-', '-', '-', '-']);
      return;
    }
    var hasData = false;
    floors.forEach(function(f) {
      var floorRows = dateRows[f.id];
      if(!floorRows) return;
      var assigned = floorRows.filter(function(id){return id !== null});
      if(!assigned.length) return;
      hasData = true;
      assigned.forEach(function(pid) {
        var p = S.pharms.find(function(x){return x.id===pid});
        if(!p) return;
        var catLabel = p.cat==='practicing'?t('catPracticing'):p.cat==='exempt'?t('catExempt'):p.cat==='trainee'?t('catTrainee'):'';
        data.push([dayLabel, dateLabel, toEN(S.lang==='ar'?f.ar:f.en), phName(p), p.id, catLabel]);
      });
    });
  });

  if(data.length === 0) { toast(t('noData'), 'warning'); return; }
  var shiftLabel = shift==='morning'?t('schedMorning'):shift==='evening'?t('schedEvening'):t('schedOvernight');
  var dir = S.lang==='ar' ? 'rtl' : 'ltr';
  var align = S.lang==='ar' ? 'right' : 'left';
  var printDateStr = fmtPrintDate(new Date());
  var w = window.open('', '_blank');
  if(!w) { toast('Please allow popups', 'error'); return; }
  w.document.write('<!DOCTYPE html><html dir="'+dir+'"><head><meta charset="UTF-8"><title>'+shiftLabel+'</title>');
  w.document.write("<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans:wght@400;700&display=swap');");
  w.document.write("body{font-family:'Noto Naskh Arabic','Noto Sans',sans-serif;padding:24px;color:#1C1E21}");
  w.document.write(".print-header{text-align:center;margin-bottom:24px}.print-title{font-size:22px;font-weight:700;margin-bottom:8px}.print-date{font-size:18px;font-weight:700;color:#1877F2;margin-bottom:4px}.print-unit{font-size:16px;font-weight:700;color:#1C1E21;margin-top:6px}");
  w.document.write("table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border:1px solid #DADDE1;padding:8px 10px;text-align:"+align+";font-size:13px}th{background:#F0F2F5;font-weight:600}");
  w.document.write("@media print{body{padding:10px}}</style>");
  w.document.write('</head><body>');
  w.document.write('<div class="print-header"><div class="print-title">'+shiftLabel+'</div><div class="print-date">'+printDateStr+'</div><div class="print-unit">'+t('clinicalPharmacyUnit')+'</div></div>');
  w.document.write('<table><thead><tr><th>#</th>'+headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>');
  data.forEach(function(r, i) { w.document.write('<tr><td style="font-weight:700;text-align:center">'+(i+1)+'</td>'+r.map(function(c){return '<td>'+toEN(String(c))+'</td>';}).join('')+'</tr>'); });
  w.document.write('</tbody></table>');
  w.document.write('<script>setTimeout(function(){window.print();},800)<\/script></body></html>');
  w.document.close();
  toast(t('printDone'), 'info');
}

function doAddPharm() {
  var nameInp = document.getElementById('newPharmName');
  var codeInp = document.getElementById('newPharmCode');
  var catInp = document.getElementById('newPharmCat');
  var floorInp = document.getElementById('newPharmFloor');
  var phoneInp = document.getElementById('newPharmPhone');
  var passInp = document.getElementById('newPharmPass');
  if(!nameInp || !codeInp || !catInp || !floorInp || !passInp) return;
  var name = nameInp.value.trim();
  var code = toEN(codeInp.value.trim()).toUpperCase();
  var cat = catInp.value;
  var floor = floorInp.value;
  var phone = phoneInp ? phoneInp.value.trim() : '';
  var pass = passInp.value.trim();
  var errBox = document.getElementById('addPharmErr');
  if(!name) { if(errBox){errBox.style.display='block';errBox.textContent='⚠ '+t('nameRequired');} nameInp.focus(); return; }
  if(!code) { if(errBox){errBox.style.display='block';errBox.textContent='⚠ '+t('codeRequired');} codeInp.focus(); return; }
  if(!pass) { if(errBox){errBox.style.display='block';errBox.textContent='⚠ '+t('passwordRequired');} passInp.focus(); return; }
  if(pass.length < 4) { if(errBox){errBox.style.display='block';errBox.textContent='⚠ '+t('passwordShortPharm');} passInp.focus(); return; }
  /* التحقق من عدم تكرار الكود */
  var exists = S.pharms.find(function(p) { return p.id === code; });
  if(exists) { if(errBox){errBox.style.display='block';errBox.textContent='⚠ '+t('codeExists');} codeInp.focus(); return; }
  /* التحقق من عدم تكرار اسم المستخدم */
  var userExists = USERS.find(function(u) { return u.username === name; });
  if(userExists) { if(errBox){errBox.style.display='block';errBox.textContent='⚠ '+t('codeExists');} nameInp.focus(); return; }
  if(errBox) errBox.style.display = 'none';
  var clr = ACOLS[S.pharms.length % ACOLS.length];
  var newP = {id: code, en: name, ar: name, fl: floor, clr: clr, restCredits: 0, addedCredits: 0, cat: cat, phone: phone};
  S.pharms.push(newP);
  /* إنشاء حساب مستخدم للصيدلي */
  var newUserId = 'U' + Date.now();
  USERS.push({id: newUserId, username: name, password: pass, role: 'member', name: {ar: name, en: name}, floor: floor, clr: clr, status: 'active', linkedPid: code});
  /* إضافة صفوف فارغة للصيدلي الجديد */
  if(!S.mRows[floor]) S.mRows[floor] = [];
  toast(t('pharmacistAdded') + ' - ' + t('userCreatedForPharm'), 'success');
  showSuccessPopup(t('pharmacistAdded'), name);
  /* إعادة تعيين الحقول لإضافة صيدلي آخر دون إغلاق النافذة */
  nameInp.value = '';
  codeInp.value = '';
  catInp.value = '';
  if(phoneInp) phoneInp.value = '';
  passInp.value = '';
  nameInp.focus();
  renderScreen();
}

function doDeletePharm(pid) {
  if(!confirm(t('deletePharmacistConfirm'))) return;
  /* إزالة من الحضور */
  Object.keys(S.mRows).forEach(function(k) {
    S.mRows[k] = S.mRows[k].filter(function(id) { return id !== pid; });
  });
  Object.keys(S.eRows).forEach(function(k) {
    S.eRows[k] = S.eRows[k].filter(function(id) { return id !== pid; });
  });
  Object.keys(S.oRows).forEach(function(k) {
    S.oRows[k] = S.oRows[k].filter(function(id) { return id !== pid; });
  });
  /* إزالة من تاريخ الحضور */
  if(S.attHistory) {
    Object.keys(S.attHistory).forEach(function(d) {
      var rec = S.attHistory[d];
      if(rec.m) rec.m = rec.m.filter(function(id) { return id !== pid; });
      if(rec.e) rec.e = rec.e.filter(function(id) { return id !== pid; });
      if(rec.o) rec.o = rec.o.filter(function(id) { return id !== pid; });
    });
  }
  /* إزالة من الجداول */
  [S.schedMRows, S.schedERows, S.schedORows].forEach(function(allRows) {
    Object.keys(allRows).forEach(function(dateStr) {
      var dateData = allRows[dateStr];
      if(dateData) Object.keys(dateData).forEach(function(flId) {
        if(Array.isArray(dateData[flId])) dateData[flId] = dateData[flId].filter(function(id) { return id !== pid; });
      });
    });
  });
  /* إزالة الاستراحات والإجازات */
  S.breaks = S.breaks.filter(function(b) { return b.pid !== pid; });
  S.leaves = S.leaves.filter(function(l) { return l.pid !== pid; });
  S.notifs = S.notifs.filter(function(n) { return n.pid !== pid; });
  /* إزالة سجل الحضور */
  S.attendanceLog = S.attendanceLog.filter(function(e) { return e.pid !== pid; });
  /* إلغاء الربط مع المستخدم */
  USERS.forEach(function(u) { if(u.linkedPid === pid) u.linkedPid = null; });
  /* إزالة الصيدلي */
  S.pharms = S.pharms.filter(function(p) { return p.id !== pid; });
  toast(t('pharmacistDeleted'), 'success');
  hideModal();
  renderScreen();
  renderNav();
  updBadge();
}

/* ========== حفظ تعديلات الصيدلي ========== */
function doSavePharm(oldPid) {
  var p = S.pharms.find(function(x){return x.id===oldPid});
  if(!p) return;
  var nameArInp = document.getElementById('editPharmNameAr');
  var nameEnInp = document.getElementById('editPharmNameEn');
  var codeInp = document.getElementById('editPharmCode');
  var catInp = document.getElementById('editPharmCat');
  var phoneInp = document.getElementById('editPharmPhone');
  var floorInp = document.getElementById('editPharmFloor');
  if(!nameArInp || !nameEnInp || !codeInp) return;

  var nameAr = nameArInp.value.trim();
  var nameEn = nameEnInp.value.trim();
  var newCode = toEN(codeInp.value.trim()).toUpperCase();
  var errBox = document.getElementById('editPharmErr');
  if(!nameAr && !nameEn) { if(errBox){errBox.style.display='block';errBox.textContent='\u26a0 '+t('nameRequired');} return; }
  if(!newCode) { if(errBox){errBox.style.display='block';errBox.textContent='\u26a0 '+t('codeRequired');} return; }

  /* التحقق من تكرار رقم البصمة */
  var dup = S.pharms.find(function(x){ return x.id === newCode && x.id !== oldPid; });
  if(dup) { if(errBox){errBox.style.display='block';errBox.textContent='\u26a0 '+t('codeExists');} return; }
  if(errBox) errBox.style.display = 'none';

  /* تحديث رقم البصمة إذا تغير */
  if(newCode !== oldPid) {
    /* تحديث المراجع في جميع البيانات */
    Object.keys(S.mRows).forEach(function(k) {
      S.mRows[k] = S.mRows[k].map(function(id) { return id === oldPid ? newCode : id; });
    });
    Object.keys(S.eRows).forEach(function(k) {
      S.eRows[k] = S.eRows[k].map(function(id) { return id === oldPid ? newCode : id; });
    });
    Object.keys(S.oRows).forEach(function(k) {
      S.oRows[k] = S.oRows[k].map(function(id) { return id === oldPid ? newCode : id; });
    });
    if(S.attHistory) {
      Object.keys(S.attHistory).forEach(function(d) {
        var rec = S.attHistory[d];
        if(rec.m) rec.m = rec.m.map(function(id) { return id === oldPid ? newCode : id; });
        if(rec.e) rec.e = rec.e.map(function(id) { return id === oldPid ? newCode : id; });
        if(rec.o) rec.o = rec.o.map(function(id) { return id === oldPid ? newCode : id; });
      });
    }
    S.breaks.forEach(function(b) { if(b.pid === oldPid) b.pid = newCode; });
    S.leaves.forEach(function(l) { if(l.pid === oldPid) l.pid = newCode; });
    S.notifs.forEach(function(n) { if(n.pid === oldPid) n.pid = newCode; });
    USERS.forEach(function(u) { if(u.linkedPid === oldPid) u.linkedPid = newCode; });
    [S.schedMRows, S.schedERows, S.schedORows].forEach(function(allRows) {
      Object.keys(allRows).forEach(function(dateStr) {
        var dateData = allRows[dateStr];
        if(dateData) Object.keys(dateData).forEach(function(flId) {
          if(Array.isArray(dateData[flId])) dateData[flId] = dateData[flId].map(function(id) { return id === oldPid ? newCode : id; });
        });
      });
    });
    p.id = newCode;
  }

  p.ar = nameAr || nameEn;
  p.en = nameEn || nameAr;
  p.cat = catInp ? catInp.value : p.cat;
  p.phone = phoneInp ? phoneInp.value.trim() : p.phone;
  var newFloor = floorInp ? floorInp.value : p.fl;
  if(newFloor !== p.fl) {
    p.fl = newFloor;
    if(!S.mRows[newFloor]) S.mRows[newFloor] = [];
  }

  /* تحديث اسم المستخدم المرتبط إن وجد */
  var linkedUser = USERS.find(function(u){ return u.linkedPid === p.id; });
  if(linkedUser) {
    linkedUser.name.ar = p.ar;
    linkedUser.name.en = p.en;
    linkedUser.floor = newFloor;
  }

  toast(t('pharmacistSaved'), 'success');
  hideModal();
  renderScreen();
}

function getAttData(sh) {

function doStartBreak(pid, fl, sh) {
  var active = S.breaks.find(function(b) { return b.pid===pid && b.shift===sh && !b.endTime; });
  if(active) { toast(t('alreadyOnBreak'), 'warning'); return; }
  var p = S.pharms.find(function(x){return x.id===pid});
  var totalCredits = p ? ((p.restCredits || 0) + (p.addedCredits || 0)) : 0;
  if(totalCredits <= 0) { toast(t('noMoreBreaks'), 'error'); return; }
  /* خصم ١ — أولاً من الرصيد المضاف، ثم من رصيد الحضور FIFO */
  var usedAddedCredits = false;
  if((p.addedCredits || 0) > 0) {
    p.addedCredits = (p.addedCredits || 0) - 1;
    usedAddedCredits = true;
  } else {
    p.restCredits = Math.max(0, (p.restCredits || 0) - 1);
  }
  /* البحث عن أقدم سجل حضور غير مستخدم (FIFO) — فقط إذا لم يُخصم من المضاف */
  var oldestAtt = null;
  if(!usedAddedCredits) {
    var sortedAtt = S.attendanceLog.filter(function(e){ return e.pid === pid && !e.usedForBreak; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
    if(sortedAtt.length > 0) {
      oldestAtt = sortedAtt[0];
      oldestAtt.usedForBreak = true;
    }
  }
  var consumedAttDate = oldestAtt ? oldestAtt.date : null;
  var consumedAttShift = oldestAtt ? oldestAtt.shift : sh;
  var consumedAttFloor = oldestAtt ? oldestAtt.floor : fl;
  S.breaks.push({id: Date.now(), pid:pid, day:new Date().getDate(), dateStr:todayStr(), fl:consumedAttFloor, shift:consumedAttShift, startTime:nowTime(), endTime:null, attDate:consumedAttDate, fromAdded:usedAddedCredits});
  toast(t('breakStarted'), 'success');
  showBreaksModal(sh);
}

function doEndBreak(pid, bid, sh) {
  var b = S.breaks.find(function(x) { return x.id === bid; });
  if(b) { b.endTime = nowTime(); toast(t('breakEnded'), 'success'); showBreaksModal(sh); }
}

function doSubmitLeave() {

    var exists = S.leaves.find(function(l) { return l.pid===pid && l.date===date && l.lvType==='rest'; });

    if(isSupervisor() && currentUser) newLeaveObj.requestedBy = currentUser.id;

    } else {

/* ========== تطبيق الاستراحة (خصم الرصيد وإضافة للتقارير) ========== */
function applyRestBreak(pid, p, date) {
  if(!p) return;
  var usedAddedCredits = false;
  /* خصم ١ — أولاً من الرصيد المضاف، ثم من رصيد الحضور FIFO */
  if((p.addedCredits || 0) > 0) {
    p.addedCredits = (p.addedCredits || 0) - 1;
    usedAddedCredits = true;
  } else {
    p.restCredits = Math.max(0, (p.restCredits || 0) - 1);
  }
  /* البحث عن أقدم سجل حضور غير مستخدم (FIFO) — فقط إذا لم يُخصم من المضاف */
  var oldestAtt = null;
  if(!usedAddedCredits) {
    var sortedAtt = S.attendanceLog.filter(function(e){ return e.pid === pid && !e.usedForBreak; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
    if(sortedAtt.length > 0) {
      oldestAtt = sortedAtt[0];
      oldestAtt.usedForBreak = true;
    }
  }
  var consumedAttDate = oldestAtt ? oldestAtt.date : null;
  var consumedAttShift = oldestAtt ? oldestAtt.shift : '';
  var consumedAttFloor = oldestAtt ? oldestAtt.floor : p.fl;
  /* إضافة إلى تقارير الاستراحة مع تاريخ الحضور المستهلك */
  S.breaks.push({id: Date.now(), pid:pid, day:new Date(date).getDate(), dateStr:date, fl:consumedAttFloor, shift:consumedAttShift, startTime:'', endTime:null, attDate:consumedAttDate, fromAdded:usedAddedCredits});
}

/* ========== إلغاء إجازة / استراحة ========== */
function doCancelLeave(lid, pid, lvType) {
  lid = +lid;
  var lv = S.leaves.find(function(l) { return l.id === lid; });
  if(!lv) { toast(t('noData'), 'error'); return; }
  /* تأكيد الإلغاء */
  if(!confirm(t('cancelLeaveConfirm'))) return;
  /* إزالة الإجازة من القائمة */
  S.leaves = S.leaves.filter(function(l) { return l.id !== lid; });
  /* إذا كانت استراحة معتمدة، إعادة +١ واستعادة سجل الحضور */
  if(lvType === 'rest' && lv.status === 'approved') {
    var p = S.pharms.find(function(x){return x.id===pid});
    if(p) {
      /* البحث عن سجل الاستراحة لمعرفة إن كان من الرصيد المضاف */
      var brkEntry = S.breaks.filter(function(b){ return b.pid === pid && b.dateStr === lv.date; }).sort(function(a,b){ return b.id - a.id; })[0];
      if(brkEntry && brkEntry.fromAdded) {
        /* إعادة +١ إلى الرصيد المضاف */
        p.addedCredits = (p.addedCredits || 0) + 1;
      } else {
        /* إعادة +١ إلى رصيد الحضور */
        p.restCredits = (p.restCredits || 0) + 1;
      }
    }
    /* استعادة أحدث سجل حضور مستهلك لهذا الصيدلي */
    if(brkEntry) {
      /* إلغاء تحديد سجل الحضور كـمستخدم للاستراحة */
      if(brkEntry.attDate) {
        for(var ci = S.attendanceLog.length - 1; ci >= 0; ci--) {
          if(S.attendanceLog[ci].pid === pid && S.attendanceLog[ci].date === brkEntry.attDate && S.attendanceLog[ci].usedForBreak) {
            S.attendanceLog[ci].usedForBreak = false;
            break;
          }
        }
      }
      /* إزالة سجل الاستراحة من التقارير */
      S.breaks = S.breaks.filter(function(b){ return b.id !== brkEntry.id; });
    }
    toast(t('restCancelled') + ' (+1)', 'success');
  } else if(lvType === 'rest') {
    /* إلغاء استراحة معلقة — لا حاجة لاسترجاع الرصيد لأنه لم يُخصم */
    toast(t('leaveCancelled'), 'success');
  } else {
    /* إلغاء إجازة عادية — يتم التراجع تلقائياً من عداد الشهر بحذفها من القائمة */
    toast(t('leaveCancelled'), 'success');
  }
  /* إعادة فتح صفحة تفاصيل الصيدلي بعد الإلغاء */
  showPharmDetail(pid);
  renderScreen();
  updBadge();
}
