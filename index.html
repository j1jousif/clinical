/* ========== موافقة/رفض طلبات الجدول (للمدير) ========== */
function doApproveSchedReq(reqId) {
  var req = S.pendingSchedReqs.find(function(r) { return r.id === reqId; });
  if(!req) return;
  req.status = 'approved';
  /* إضافة الصيدلي إلى الجدول الصباحي */
  var today = todayStr();
  var schedRows = getSchedRowsForDate('morning', today);
  if(!schedRows[req.fl]) schedRows[req.fl] = [];
  var exists = schedRows[req.fl].indexOf(req.pid) !== -1;
  if(!exists) {
    var emptyIdx = schedRows[req.fl].indexOf(null);
    if(emptyIdx !== -1) {
      schedRows[req.fl][emptyIdx] = req.pid;
    } else {
      schedRows[req.fl].push(req.pid);
    }
    setSchedRowsForDate('morning', today, schedRows);
  }
  /* إضافة إلى الحضور أيضاً */
  if(!S.mRows[req.fl]) S.mRows[req.fl] = [];
  var existsM = S.mRows[req.fl].indexOf(req.pid) !== -1;
  if(!existsM) {
    var emptyIdxM = S.mRows[req.fl].indexOf(null);
    if(emptyIdxM !== -1) {
      S.mRows[req.fl][emptyIdxM] = req.pid;
    } else {
      S.mRows[req.fl].push(req.pid);
    }
  }
  /* إضافة رصيد استراحات */
  var p = S.pharms.find(function(x){return x.id===req.pid});
  if(p) {
    p.restCredits = (p.restCredits || 0) + 1;
    /* حفظ تاريخ الحضور في سجل الأيام */
    S.attendanceLog.push({
      id: Date.now(),
      pid: req.pid,
      date: today,
      shift: 'morning',
      credits: 1,
      floor: req.fl
    });
  }

  toast(t('schedReqApproved'), 'success');
  showSuccessPopup(t('schedReqApproved'), p ? phName(p) : '');
  renderScreen();
  updBadge();
}

function doExportSchedule(shift) {
  var now = new Date();
  var year = now.getFullYear(), month = now.getMonth();
  if(S.schedSelMonth) {
    var mParts = S.schedSelMonth.split('-');
    year = parseInt(mParts[0]); month = parseInt(mParts[1]) - 1;
  }
  var schedDates = getSchedDates(year, month, shift);
  var floors;
  var allRows = shift==='morning' ? S.schedMRows : shift==='evening' ? S.schedERows : S.schedORows;
  if(shift === 'morning') { floors = FLOORS; }
  else if(shift === 'evening') { floors = EVENING_FLOORS; }
  else { floors = OVERNIGHT_FLOORS; }

  var headers = [t('dayName'), t('date'), t('floor'), t('colName'), t('idCode'), t('colCategory')];
  var data = [];
  schedDates.forEach(function(dInfo) {
    var dayLabel = dInfo.dayName;
    var dateLabel = fmtPrintDate(dInfo.date);
    var dateRows = allRows[dInfo.dateStr];
    if(!dateRows) return;
    floors.forEach(function(f) {
      var floorRows = dateRows[f.id];
      if(!floorRows) return;
      var assigned = floorRows.filter(function(id){return id !== null});
      if(!assigned.length) return;
      assigned.forEach(function(pid) {
        var p = S.pharms.find(function(x){return x.id===pid});
        if(!p) return;
        var catLabel = p.cat==='practicing'?t('catPracticing'):p.cat==='exempt'?t('catExempt'):p.cat==='trainee'?t('catTrainee'):'';
        data.push([dayLabel, dateLabel, toEN(S.lang==='ar'?f.ar:f.en), phName(p), p.id, catLabel]);
      });
    });
  });
  if(data.length === 0) { toast(t('noData'), 'warning'); return; }
  var shiftLabel = shift==='morning'?t('schedMorning'):shift==='evening'?t('schedEvening'):t('schedOvernight');
  showExportModal(headers, data, shiftLabel, 'schedule_'+shift+'_'+year+'_'+(month+1));
}

document.getElementById('main').addEventListener('click', function(e) {
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var a = el.dataset.act;
  switch(a) {
    case 'add-row': {
      var addDt = el.dataset.dt || '';
      var addRows = getAttEditRows(el.dataset.sh, addDt);
      if(!addRows[el.dataset.fl]) addRows[el.dataset.fl] = [];
      addRows[el.dataset.fl].push(null);
      renderScreen();
      break;
    }
    case 'del-row': {
      var delDt = el.dataset.dt || '';
      var rowsD = getAttEditRows(el.dataset.sh, delDt);
      var delSh = el.dataset.sh;
      var delIdx = +el.dataset.idx;
      var delFl = el.dataset.fl;
      var delPid = rowsD[delFl][delIdx];
      if(delPid) {
        /* عرض نافذة تأكيد قبل الحذف لأن الصف يحتوي على اسم */
        var delPName = '';
        var delTmp = S.pharms.find(function(x){return x.id===delPid});
        if(delTmp) delPName = delTmp.name;
        showRowConfirmModal('delete', delSh, delFl, delIdx, delPid, delPName);
      } else {
        rowsD[delFl].splice(delIdx, 1);
        toast(t('rowDeleted'), 'success');
        renderScreen();
      }
      break;
    }
    case 'clr-row': {
      var clrDt = el.dataset.dt || '';
      var rows2 = getAttEditRows(el.dataset.sh, clrDt);
      var clrSh = el.dataset.sh;
      var clrIdx = +el.dataset.idx;
      var clrFl = el.dataset.fl;
      var clrPid = rows2[clrFl][clrIdx];
      if(clrPid) {
        /* عرض نافذة تأكيد قبل المسح لأن الصف يحتوي على اسم */
        var clrPName = '';
        var clrTmp = S.pharms.find(function(x){return x.id===clrPid});
        if(clrTmp) clrPName = clrTmp.name;
        showRowConfirmModal('clear', clrSh, clrFl, clrIdx, clrPid, clrPName);
      } else {
        rows2[clrFl][clrIdx] = null;
        renderScreen();
      }
      break;
    }
    case 'export-att': doExportAtt(el.dataset.sh); break;
    case 'print-att': doPrintAtt(el.dataset.sh); break;
    case 'mgr-breaks': showBreaksModal(el.dataset.sh); break;
    case 'att-select-date': {
      saveCurrentAttToHistory();

    }

    case 'add-pharm': showAddPharmForm(); break;

    case 'print-staff': doPrintStaff(); break;

    case 'edit-pharm': showEditPharmModal(el.dataset.pid); break;

        btn.style.color = isActive ? '#fff' : dc2[1];

    case 'add-sched-day': showAddDayModal(); break;
    case 'open-sched-calendar': showSchedCalendar(); break;
    case 'remove-sched-custom-date': {
      var rmDateStr = el.dataset.date;
      S.schedCustomDates = (S.schedCustomDates || []).filter(function(d){ return d !== rmDateStr; });
      renderScreen();
      break;
    }
    case 'add-sched-row': {
      var addDt = el.dataset.dt || S.schedSelectedDate || '';
      var schedRowsAdd = getSchedRowsForDate(el.dataset.sh, addDt);
      if(!schedRowsAdd[el.dataset.fl]) schedRowsAdd[el.dataset.fl] = [];
      schedRowsAdd[el.dataset.fl].push(null);
      setSchedRowsForDate(el.dataset.sh, addDt, schedRowsAdd);
      /* تحديث الجدول فقط */
      var addContainer = document.getElementById('schedTable');
      var addNow = new Date(); var addY = addNow.getFullYear(), addM = addNow.getMonth();
      if(S.schedSelMonth) { var addSp = S.schedSelMonth.split('-'); addY = parseInt(addSp[0]); addM = parseInt(addSp[1]) - 1; }

        addContainer.innerHTML = buildScheduleTable(el.dataset.sh, addY, addM, addDt);
        lucide.createIcons({nodes:[addContainer]});
      }
      break;
    }
    case 'del-sched-row': {
      var delDt = el.dataset.dt || S.schedSelectedDate || '';
      var schedRowsDel = getSchedRowsForDate(el.dataset.sh, delDt);

      if(schedRowsDel[el.dataset.fl]) {
        schedRowsDel[el.dataset.fl].splice(delSIdx, 1);

        if(schedRowsDel[el.dataset.fl].length === 0) schedRowsDel[el.dataset.fl] = [null];
      }
      setSchedRowsForDate(el.dataset.sh, delDt, schedRowsDel);
      toast(t('rowDeleted'), 'success');
      var delContainer = document.getElementById('schedTable');
      var delNow = new Date(); var delY = delNow.getFullYear(), delM = delNow.getMonth();
      if(S.schedSelMonth) { var delSp = S.schedSelMonth.split('-'); delY = parseInt(delSp[0]); delM = parseInt(delSp[1]) - 1; }
      if(delContainer) {
        delContainer.innerHTML = buildScheduleTable(el.dataset.sh, delY, delM, delDt);
        lucide.createIcons({nodes:[delContainer]});
      }
      break;
    }
    case 'clr-sched-row': {
      var clrDt = el.dataset.dt || S.schedSelectedDate || '';
      var schedRowsClr = getSchedRowsForDate(el.dataset.sh, clrDt);
      if(schedRowsClr[el.dataset.fl]) {
        schedRowsClr[el.dataset.fl][+el.dataset.idx] = null;
      }
      setSchedRowsForDate(el.dataset.sh, clrDt, schedRowsClr);
      var clrContainer = document.getElementById('schedTable');
      var clrNow = new Date(); var clrY = clrNow.getFullYear(), clrM = clrNow.getMonth();
      if(S.schedSelMonth) { var clrSp = S.schedSelMonth.split('-'); clrY = parseInt(clrSp[0]); clrM = parseInt(clrSp[1]) - 1; }
      if(clrContainer) {
        clrContainer.innerHTML = buildScheduleTable(el.dataset.sh, clrY, clrM, clrDt);
        lucide.createIcons({nodes:[clrContainer]});
      }
      break;
    }
    case 'export-pharm-rpt': doExportPharmReport(); break;
    case 'print-pharm-rpt': doPrintPharmReport(); break;
    case 'cancel-lv': doCancelLeave(+el.dataset.lid, el.dataset.pid, el.dataset.lvtype); break;
    case 'toggle-staff-date': {
      var tgtDate = el.dataset.date;
      var tgtEl = document.getElementById('staffDate_'+tgtDate);
      if(tgtEl) {
        tgtEl.style.display = tgtEl.style.display === 'none' ? '' : 'none';
      }
      break;
    }
    /* موافقة/رفض الإجازات المعلقة */
    case 'approve-lv': doApproveLeave(+el.dataset.lid); break;
    case 'reject-lv': doRejectLeave(+el.dataset.lid); break;
    /* المسؤول: إلغاء طلب إجازة/استراحة معلقة */
    case 'cancel-pending-lv': {
      var cpLid = +el.dataset.lid;
      var cpLv = S.leaves.find(function(l) { return l.id === cpLid; });
      if(!cpLv || cpLv.status !== 'pending') { toast(t('noData'), 'error'); break; }
      if(!confirm(t('cancelLeaveConfirm'))) break;
      /* التحقق من أن الطلب من قبل المسؤول الحالي */
      if(isSupervisor() && currentUser && cpLv.requestedBy !== currentUser.id) { toast(t('noPermission'), 'error'); break; }
      S.leaves = S.leaves.filter(function(l) { return l.id !== cpLid; });
      toast(t('leaveCancelled'), 'success');
      renderScreen();
      updBadge();
      break;
    }
    /* موافقة/رفض طلبات الجدول المعلقة */
    case 'approve-sched-req': doApproveSchedReq(+el.dataset.rid); break;
    case 'reject-sched-req': doRejectSchedReq(+el.dataset.rid); break;
    /* المسؤول: طلب إضافة للجدول الصباحي */
    case 'req-sched-add': showSupervisorSchedReqForm(); break;
    /* إدارة المستخدمين */
    case 'approve-user': showApproveUserModal(el.dataset.uid); break;
    case 'reject-user': {
      if(confirm(t('deleteUserConfirm'))) {
        doRejectUser(el.dataset.uid);
        toast(t('rejectedUser'), 'success');
        renderScreen();
      }
      break;
    }
    case 'edit-user-role': showChangeRoleModal(el.dataset.uid); break;
    case 'promote-user': showChangeRoleModal(el.dataset.uid, el.dataset.newrole); break;
    case 'demote-user': showChangeRoleModal(el.dataset.uid, el.dataset.newrole); break;
    case 'filter-parts': {
      S.partFilter = el.dataset.role;
      renderScreen();
      break;
    }
    case 'ug-switch-tab': {
      S.ugSub = el.dataset.tab;
      S.ugSearch = '';
      renderScreen();
      /* ربط البحث */
      setTimeout(function() {
        var searchInput = document.getElementById('ugSearchInput');
        if(searchInput) {
          searchInput.addEventListener('input', function() {
            S.ugSearch = this.value;
            renderScreen();
            /* إعادة التركيز على البحث */
            var newInput = document.getElementById('ugSearchInput');
            if(newInput) { newInput.focus(); newInput.setSelectionRange(newInput.value.length, newInput.value.length); }
          });
        }
      }, 50);
      break;
    }
    case 'delete-user': {
      var delUid = el.dataset.uid;
      var delU = USERS.find(function(x){return x.id===delUid});
      if(delU && delU.role === 'admin') { toast(t('noPermission'), 'error'); break; }
      if(confirm(t('deleteUserConfirm'))) {
        USERS = USERS.filter(function(x) { return x.id !== delUid; });
        PENDING_USERS = PENDING_USERS.filter(function(x) { return x.id !== delUid; });
        toast(t('userDeleted'), 'success');
        renderScreen();
      }
      break;
    }
  }
});

document.getElementById('mSheet').addEventListener('click', function(e) {
  var el = e.target.closest('[data-mact]');
  if(!el) return;
  var a = el.dataset.mact;
  switch(a) {
    case 'close-modal': hideModal(); break;
    case 'cal-prev-year': _calYear--; renderSchedCalendar(); break;
    case 'cal-next-year': _calYear++; renderSchedCalendar(); break;
    case 'cal-select-month': {
      var selM = parseInt(el.dataset.month);
      S.schedSelMonth = _calYear + '-' + String(selM + 1).padStart(2, '0');
      S.schedSelectedDate = null;
      hideModal();
      renderScreen();
      break;
    }
    case 'cal-today': {
      var todayNow = new Date();
      S.schedSelMonth = todayNow.getFullYear() + '-' + String(todayNow.getMonth() + 1).padStart(2, '0');
      S.schedSelectedDate = null;
      hideModal();
      renderScreen();
      break;
    }
    case 'show-att-log-pharm': {
      var attLogPid = el.dataset.pid;
      if(attLogPid) {
        hideModal();
        setTimeout(function() { showAttLogModal(attLogPid); }, 200);
      }
      break;
    }
    case 'start-brk': doStartBreak(el.dataset.pid, el.dataset.fl, el.dataset.sh); break;
    case 'do-clr-row': {
      var dcDt = el.dataset.dt || '';
      var dcRows = getAttEditRows(el.dataset.sh, dcDt);
      var dcSh = el.dataset.sh;
      var dcIdx = +el.dataset.idx;
      var dcFl = el.dataset.fl;
      var dcPid = el.dataset.pid;
      if(dcPid) {
        var dcHasR = S.leaves.some(function(l){ return l.pid===dcPid && l.lvType==='rest' && l.status!=='rejected'; });
        if(dcHasR) { toast(t('cannotDeleteRestUsed'), 'error'); hideModal(); break; }
        var dcP = S.pharms.find(function(x){return x.id===dcPid});
        if(dcP) {
          var dcCredits = dcSh === 'morning' ? 1 : 2;
          dcP.restCredits = Math.max(0, (dcP.restCredits || 0) - dcCredits);
          /* حذف من سجل الحضور */
          var dcDate = dcDt || todayStr();
          var dcLogIdx = -1;
          for(var dci = S.attendanceLog.length - 1; dci >= 0; dci--) {
            if(S.attendanceLog[dci].pid === dcPid && S.attendanceLog[dci].date === dcDate && S.attendanceLog[dci].shift === dcSh && S.attendanceLog[dci].floor === dcFl) { dcLogIdx = dci; break; }
          }
          if(dcLogIdx !== -1) S.attendanceLog.splice(dcLogIdx, 1);
        }
      }
      dcRows[dcFl][dcIdx] = null;
      hideModal();
      toast(t('valueCleared'), 'success');
      renderScreen();
      break;
    }
    case 'do-del-row': {
      var ddDt = el.dataset.dt || '';
      var ddRows = getAttEditRows(el.dataset.sh, ddDt);
      var ddSh = el.dataset.sh;
      var ddIdx = +el.dataset.idx;
      var ddFl = el.dataset.fl;
      var ddPid = el.dataset.pid;
      if(ddPid) {
        var ddHasR = S.leaves.some(function(l){ return l.pid===ddPid && l.lvType==='rest' && l.status!=='rejected'; });
        if(ddHasR) { toast(t('cannotDeleteRestUsed'), 'error'); hideModal(); break; }
        var ddP = S.pharms.find(function(x){return x.id===ddPid});
        if(ddP) {
          var ddCredits = ddSh === 'morning' ? 1 : 2;
          ddP.restCredits = Math.max(0, (ddP.restCredits || 0) - ddCredits);
          /* حذف من سجل الحضور */
          var ddDate = ddDt || todayStr();
          var ddLogIdx = -1;
          for(var ddi = S.attendanceLog.length - 1; ddi >= 0; ddi--) {
            if(S.attendanceLog[ddi].pid === ddPid && S.attendanceLog[ddi].date === ddDate && S.attendanceLog[ddi].shift === ddSh && S.attendanceLog[ddi].floor === ddFl) { ddLogIdx = ddi; break; }
          }
          if(ddLogIdx !== -1) S.attendanceLog.splice(ddLogIdx, 1);
        }
      }
      ddRows[ddFl].splice(ddIdx, 1);
      hideModal();
      toast(t('rowDeleted'), 'success');
      renderScreen();
      break;
    }
    case 'do-save-settings': {
      var sNewUser = document.getElementById('settingsNewUser').value.trim();
      var sCurPass = document.getElementById('settingsCurPass').value;
      var sNewPass = document.getElementById('settingsNewPass').value;
      var sConfPass = document.getElementById('settingsConfPass').value;
      /* التحقق من كلمة المرور الحالية */
      if(!sCurPass) { toast(t('settingsNeedCurPass'), 'warning'); break; }
      if(sCurPass !== currentUser.password) { toast(t('settingsWrongPass'), 'error'); break; }
      /* تغيير اسم المستخدم */
      if(sNewUser && sNewUser !== currentUser.username) {
        if(sNewUser.length < 3) { toast(t('usernameShort'), 'warning'); break; }
        var dupUser = USERS.find(function(x){ return x.username === sNewUser && x.id !== currentUser.id; });
        if(dupUser) { toast(t('usernameExists'), 'error'); break; }
        currentUser.username = sNewUser;
      }
      /* تغيير كلمة المرور */
      if(sNewPass) {
        if(sNewPass.length < 4) { toast(t('passwordShort'), 'warning'); break; }
        if(sNewPass !== sConfPass) { toast(t('passwordMismatch'), 'error'); break; }
        currentUser.password = sNewPass;
      }
      hideModal();
      toast(t('settingsSaved'), 'success');
      break;
    }
    case 'end-brk': doEndBreak(el.dataset.pid, +el.dataset.bid, el.dataset.sh); break;
    case 'submit-leave': doSubmitLeave(); break;
    case 'do-reassign': doReassign(el.dataset.pid); break;
    case 'do-swap-pharm': doSwapPharm(el.dataset.pid, el.dataset.fl, el.dataset.shift); break;
    case 'do-add-sched-date': {
      var dateInp = document.getElementById('addSchedDateVal');
      if(!dateInp || !dateInp.value) { toast(t('selectDayToAdd'), 'warning'); break; }
      var newDate = dateInp.value;
      var customDates = S.schedCustomDates || [];
      /* التحقق من عدم التكرار */
      if(customDates.indexOf(newDate) !== -1) { toast(t('dayAlreadyAdded'), 'warning'); break; }
      customDates.push(newDate);
      customDates.sort();
      S.schedCustomDates = customDates;
      hideModal();
      renderScreen();
      break;
    }
    case 'do-add-pharm': doAddPharm(); break;
    case 'do-delete-pharm': doDeletePharm(el.dataset.pid); break;
    case 'do-save-pharm': doSavePharm(el.dataset.pid); break;
    case 'do-submit-sched-req': doSubmitSchedReq(); break;
    case 'do-approve-user': {
      var aRole = document.getElementById('approveUserRole');
      var aFloor = document.getElementById('approveUserFloor');
      var aCode = document.getElementById('approveUserCode');
      var aCat = document.getElementById('approveUserCat');
      var aPhone = document.getElementById('approveUserPhone');
      if(aRole) {
        var aFloorVal = aFloor ? aFloor.value : null;
        var aCodeVal = aCode ? aCode.value.trim() : '';
        var aCatVal = aCat ? aCat.value : '';
        var aPhoneVal = aPhone ? aPhone.value.trim() : '';
        doApproveUser(el.dataset.uid, aRole.value, aFloorVal, aCodeVal, aCatVal, aPhoneVal);
        toast(t('approvedUser'), 'success');
        showSuccessPopup(t('approvedUser'), '');
        hideModal();
        renderScreen();
        /* تحديث شارة الإشعارات */
        updBadge();
      }
      break;
    }
    case 'do-change-role': {
      var cRole = document.getElementById('changeRoleSelect');
      var cFloor = document.getElementById('changeFloorSelect');
      if(cRole) {
        var cFloorVal = cFloor ? cFloor.value : null;
        doChangeUserRole(el.dataset.uid, cRole.value, cFloorVal);
        toast(t('roleChanged'), 'success');
        hideModal();
        renderScreen();
      }
      break;
    }
    case 'do-reassign-pharm': { var rPid = el.dataset.pid; hideModal(); setTimeout(function(){ showReassignModal(rPid); }, 350); break; }
    case 'cancel-lv': doCancelLeave(+el.dataset.lid, el.dataset.pid, el.dataset.lvtype); break;
    /* المدير: زيادة رصيد الاستراحات */
    case 'add-rest-credits': {
      var arcPid = el.dataset.pid;
      showAddCreditsPassModal(arcPid);
      break;
    }
    case 'confirm-add-credits-pass': {
      var cpid = el.dataset.pid;
      var passInp = document.getElementById('addCrPassInp');
      if(!passInp || !passInp.value || passInp.value !== '1234qwer') {
        toast(t('wrongPass'), 'error');
        return;
      }
      showAddCreditsAmountModal(cpid);
      break;
    }
    case 'confirm-add-credits-amount': {
      var apid = el.dataset.pid;
      var amtInp = document.getElementById('addCrAmtInp');
      if(!amtInp || !amtInp.value) { toast(t('noData'), 'error'); return; }
      var aNum = parseInt(toEN(amtInp.value.replace(/[^\d]/g,'')));
      if(isNaN(aNum) || aNum <= 0) { toast(t('noData'), 'error'); return; }
      var aP = S.pharms.find(function(x){return x.id===apid});
      if(aP) {
        aP.addedCredits = aNum;
        hideModal();
        showSuccessPopup(t('addRestCreditsSuccess'), '');
        setTimeout(function(){ showPharmDetail(apid); }, 800);
        renderScreen();
      }
      break;
    }
    case 'do-export': {
      var fmt = document.getElementById('expFormat');
      if(fmt && _pendingExport) {
        if(fmt.value === 'excel') {
          exportExcel(_pendingExport.headers, _pendingExport.rows, _pendingExport.fnBase);
        } else {
          exportPDF(_pendingExport.headers, _pendingExport.rows, _pendingExport.title, _pendingExport.fnBase);
        }
        _pendingExport = null;
        hideModal();
      } else {
        toast('Export error', 'error');
      }
      break;
    }
    case 'do-print': {
      var dateInp = document.getElementById('printDateVal');
      if(dateInp && _pendingPrint) {
        printTable(_pendingPrint.headers, _pendingPrint.rows, _pendingPrint.title, dateInp.value);
        _pendingPrint = null;
        hideModal();
      } else {
        toast('Print error', 'error');
      }
      break;
    }
  }
});

});
document.getElementById('moreBtn').addEventListener('click', function(e) {

});

document.addEventListener('click', function(e) {

});
/* دعم مفتاح Enter لنوافذ زيادة الرصيد */
document.getElementById('mSheet').addEventListener('keydown', function(e) {
  if(e.key !== 'Enter') return;
  var passInp = document.getElementById('addCrPassInp');
  if(passInp && document.activeElement === passInp) {
    var btn = document.querySelector('[data-mact="confirm-add-credits-pass"]');
    if(btn) btn.click();
    return;
  }
  var amtInp = document.getElementById('addCrAmtInp');
  if(amtInp && document.activeElement === amtInp) {
    var btn2 = document.querySelector('[data-mact="confirm-add-credits-amount"]');
    if(btn2) btn2.click();
    return;
  }
});

document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') { closeAC(); hideModal(); }
});

/* ========== أحداث تسجيل الدخول والخروج ========== */
document.getElementById('loginBtn').addEventListener('click', function() {
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value;
  if(doLogin(u, p)) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    /* تعيين التبويب الافتراضي حسب الدور */
    var allowed = getAllowedTabs();
    S.tab = allowed[0] || 'morning';
    render();
  } else {
    /* التحقق مما إذا كان الحساب معلقاً */
    var pendingUser = USERS.find(function(x) { return x.username === u && x.password === p && x.status === 'pending'; });
    if(pendingUser) {
      document.getElementById('loginErr').textContent = t('signupPending');
    } else {
      document.getElementById('loginErr').textContent = t('loginErr');
    }
    document.getElementById('loginErr').classList.add('show');
  }
});
document.getElementById('loginPass').addEventListener('keydown', function(e) {
  if(e.key === 'Enter') document.getElementById('loginBtn').click();
});
document.getElementById('mmLogoutBtn').addEventListener('click', function() {
  document.getElementById('moreMenu').classList.remove('show');
  if(confirm(t('logout') + '?')) {
    currentUser = null;
    document.getElementById('loginScreen').style.display = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginErr').classList.remove('show');
  }
});
document.getElementById('mmSettingsBtn').addEventListener('click', function() {
  document.getElementById('moreMenu').classList.remove('show');
  showSettingsModal();
});

/* التبديل بين نموذجي الدخول وإنشاء الحساب */
document.getElementById('showSignupBtn').addEventListener('click', function() {
  document.getElementById('loginFormCard').style.display = 'none';
  document.getElementById('signupFormCard').style.display = 'block';
  document.getElementById('loginErr').classList.remove('show');
  /* ملء قائمة الطوابق */
  var floorSel = document.getElementById('signupFloor');
  if(floorSel && floorSel.options.length === 0) {
    FLOORS.forEach(function(f) {
      var opt = document.createElement('option');
      opt.value = f.id;
      opt.textContent = S.lang==='ar' ? f.ar : f.en;
      floorSel.appendChild(opt);
    });
  }
});
document.getElementById('showLoginBtn').addEventListener('click', function() {
  document.getElementById('signupFormCard').style.display = 'none';
  document.getElementById('loginFormCard').style.display = 'block';
  document.getElementById('signupErr').classList.remove('show');
  document.getElementById('signupErr').style.display = 'none';
});

/* تبديل عرض حقل الطابق حسب الدور المختار */
document.addEventListener('change', function(e) {
  if(e.target.name === 'signupRole') {
    var floorGroup = document.getElementById('signupFloorGroup');
    if(floorGroup) {
      floorGroup.style.display = e.target.value === 'supervisor' ? 'block' : 'none';
    }
    /* تحديث مظهر أزرار الدور */
    document.querySelectorAll('.signup-role-opt').forEach(function(lbl) {
      lbl.style.borderColor = 'transparent';
      lbl.style.background = 'var(--bg)';
    });
    var selectedLbl = e.target.closest('.signup-role-opt');
    if(selectedLbl) {
      selectedLbl.style.borderColor = 'var(--pri)';
      selectedLbl.style.background = 'var(--pri-s)';
    }
  }
});

/* زر إرسال طلب التسجيل */
document.getElementById('signupBtn').addEventListener('click', function() {
  var name = document.getElementById('signupName').value.trim();
  var username = document.getElementById('signupUser').value.trim();
  var password = document.getElementById('signupPass').value;
  var roleRadio = document.querySelector('input[name="signupRole"]:checked');
  var role = roleRadio ? roleRadio.value : 'member';
  var floorSel = document.getElementById('signupFloor');
  var floor = floorSel ? floorSel.value : null;

  var errEl = document.getElementById('signupErr');
  var result = doSignup(name, username, password, role, floor);

  if(result === 'success') {
    errEl.style.display = 'none';
    errEl.classList.remove('show');
    showSuccessPopup(t('signupSuccess'), t('signupPending'), 'var(--ok)');
    /* العودة لنموذج الدخول بعد ثانيتين */
    setTimeout(function() {
      document.getElementById('signupFormCard').style.display = 'none';
      document.getElementById('loginFormCard').style.display = 'block';
      /* مسح الحقول */
      document.getElementById('signupName').value = '';
      document.getElementById('signupUser').value = '';
      document.getElementById('signupPass').value = '';
    }, 2000);
  } else {
    var errMsg = t('signupErrFields');
    if(result === 'username_exists') errMsg = t('signupErrExists');
    else if(result === 'username_short') errMsg = t('signupErrUserShort');
    else if(result === 'password_short') errMsg = t('signupErrPassShort');
    errEl.textContent = errMsg;
    errEl.style.display = 'block';
    errEl.classList.add('show');
  }
});

/* إضافة إشعار للمدير عند وجود مستخدمين معلقين */
function checkPendingUsersNotif() {
  if(!isAdmin()) return;
  var count = PENDING_USERS.length;
  if(count > 0) {
    var msg = count + ' ' + t('pendingUsers');
    var exists = S.notifs.find(function(n) { return n.msg === msg && n.date === todayStr(); });
    if(!exists) {
      S.notifs.unshift({id: Date.now(), msg: msg, date: todayStr(), pid: null, read: false, isUserReq: true});
      updBadge();
    }
  }
}
