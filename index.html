<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>إدارة صيدلية المستشفى</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- مكتبة الأيقونات - نسخة ثابتة للاستقرار -->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
if(typeof lucide === 'undefined') {
  document.write('<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"><\/script>');
}
</script>
<!-- المكتبات الخارجية -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" crossorigin="anonymous"></script>
<script>
/* حماية من فشل تحميل المكتبات */
window.addEventListener('load', function() {
  if(typeof lucide === 'undefined' || !lucide.createIcons) {
    console.warn('Lucide icons failed to load');
    window.lucide = { createIcons: function() {} };
  }
  if(typeof XLSX === 'undefined') {
    console.warn('XLSX library failed to load');
    window.XLSX = null;
  }
});
</script>
<style>
:root{
  --pri:#1877F2;--pri-s:#E7F3FF;--pri-d:#1466D5;
  --bg:#F0F2F5;--card:#FFF;--txt:#1C1E21;--mut:#65676B;
  --ok:#42B72A;--ok-s:#E6F9EE;--warn:#F7B928;--warn-s:#FFF8E1;
  --err:#FA383E;--err-s:#FDE8EC;--pur:#7C4DFF;--pur-s:#EDE7F6;
  --bdr:#DADDE1;--r:14px;--rl:20px;--rf:9999px;
  --sh-s:0 1px 3px rgba(0,0,0,.06);--sh-m:0 4px 12px rgba(0,0,0,.08);
  --tr:.25s cubic-bezier(.4,0,.2,1);
  --topH:56px;--subH:44px;--botH:68px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Naskh Arabic',serif;background:var(--bg);color:var(--txt);line-height:1.6;overflow-x:hidden;min-height:100dvh}
html[dir=ltr] body{font-family:'Noto Sans',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-appearance:none}
input,select,textarea{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}

#app{display:flex;flex-direction:column;min-height:100dvh}

#topBar{position:sticky;top:0;z-index:100;height:var(--topH);background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px}
.pg-title{flex:1;font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-btn{width:38px;height:38px;border-radius:var(--rf);display:flex;align-items:center;justify-content:center;transition:background var(--tr);flex-shrink:0;position:relative}
.top-btn:active{transform:scale(.92)}
.top-btn:hover{background:var(--bg)}
.lang-lbl{font-size:.72rem;font-weight:700;background:var(--pri-s);color:var(--pri);width:auto!important;padding:0 10px;font-family:'Noto Sans',sans-serif}
.nbadge{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--err);color:#fff;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
html[dir=ltr] .nbadge{right:auto;left:3px}

#subTabs{background:var(--card);border-bottom:1px solid var(--bdr);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
#subTabs::-webkit-scrollbar{display:none}
.stab{padding:10px 18px;font-size:.82rem;font-weight:600;white-space:nowrap;color:var(--mut);border-bottom:2.5px solid transparent;transition:all var(--tr)}
.stab.active{color:var(--pri);border-bottom-color:var(--pri)}
.stab:active{transform:scale(.96)}

#main{flex:1;padding:10px;padding-bottom:calc(var(--botH)+16px);transition:opacity .18s,transform .18s;max-width:900px;width:100%;margin:0 auto}

#botNav{position:fixed;bottom:0;left:0;right:0;height:var(--botH);z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-around;padding:0 4px;padding-bottom:env(safe-area-inset-bottom)}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:var(--r);transition:all var(--tr);color:var(--mut);min-width:48px;flex:1}
.ni:active{transform:scale(.9)}.ni.active{color:var(--pri)}
.ni span{font-size:.6rem;font-weight:600;white-space:nowrap}
.ni svg{width:20px;height:20px;stroke-width:1.8}

.scr-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.scr-hd h2{font-size:1.05rem;font-weight:700;flex-shrink:0}
.scr-hd .date-lbl{font-size:.76rem;color:var(--mut);font-weight:500}
.hd-btns{display:flex;gap:5px;flex-shrink:0}
.ibtn{width:34px;height:34px;border-radius:var(--rf);display:flex;align-items:center;justify-content:center;background:var(--pri-s);color:var(--pri);transition:all var(--tr)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:16px;height:16px}

.flr-sec{background:var(--card);border-radius:var(--rl);box-shadow:var(--sh-s);margin-bottom:10px;overflow:visible;animation:fu .35s ease both}
.flr-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bdr)}
.flr-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flr-ico svg{width:15px;height:15px}
.flr-nm{flex:1;font-weight:600;font-size:.82rem;white-space:normal;word-break:break-word}
.flr-rows{padding:6px 8px 2px}
.att-row{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.iwrap{flex:1;min-width:0;position:relative}
.att-in,.sched-in{width:100%;padding:9px 10px;border:1.5px solid var(--bdr);border-radius:9px;font-size:.8rem;background:var(--bg);outline:none;transition:border-color var(--tr)}
.att-in:focus,.sched-in:focus{border-color:var(--pri);background:var(--card)}
.att-in.filled,.sched-in.filled{background:var(--ok-s);border-color:var(--ok);color:var(--ok);font-weight:600}
.btn-del-row{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--err);background:var(--err-s);transition:all var(--tr);flex-shrink:0}
.btn-del-row:hover{background:var(--err);color:#fff}
.btn-del-row svg{width:13px;height:13px}
.btn-clr{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--mut);transition:all var(--tr);flex-shrink:0}
.btn-clr:hover{background:var(--err-s);color:var(--err)}
.btn-clr svg{width:13px;height:13px}
.btn-add{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px;margin:3px 8px 8px;border-radius:9px;font-size:.78rem;font-weight:600;color:var(--pri);background:var(--pri-s);transition:all var(--tr);width:calc(100% - 16px)}
.btn-add:active{transform:scale(.97)}
.btn-add svg{width:16px;height:16px}
.flr-actions{display:flex;gap:6px;margin:4px 10px 10px}
.flr-actions .btn-add{flex:1;margin:0;width:auto}

#autocomplete{position:fixed;z-index:250;background:var(--card);border-radius:var(--r);box-shadow:var(--sh-m);max-height:220px;overflow-y:auto;display:none}
#autocomplete.show{display:block}
.ac-item{padding:10px 14px;font-size:.84rem;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bg)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item:active{background:var(--pri-s)}
.ac-avatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;flex-shrink:0}
.ac-info{flex:1;min-width:0}
.ac-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-id{font-size:.7rem;color:var(--mut);font-family:'Noto Sans',sans-serif}

/* قائمة البحث عن الصيدلي في نموذج الإجازة */
#lvSearchList{position:absolute;z-index:260;background:var(--card);border-radius:var(--r);box-shadow:var(--sh-m);max-height:200px;overflow-y:auto;display:none;width:100%}
#lvSearchList.show{display:block}
.lv-sl-item{padding:10px 14px;font-size:.84rem;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bg)}
.lv-sl-item:last-child{border-bottom:none}
.lv-sl-item:hover,.lv-sl-item:active{background:var(--pri-s)}

#modalOv{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
#modalOv.show{opacity:1;pointer-events:auto}
.m-sheet{background:var(--card);border-radius:var(--rl) var(--rl) 0 0;width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;padding:16px 14px;padding-bottom:calc(16px+env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
#modalOv.show .m-sheet{transform:translateY(0)}
.m-handle{width:36px;height:4px;border-radius:2px;background:var(--bdr);margin:0 auto 14px}
.m-title{font-size:1.05rem;font-weight:700;margin-bottom:14px;text-align:center}
@media(min-width:768px){.m-sheet{border-radius:var(--rl);margin-bottom:16px}#modalOv{align-items:center}}

#toasts{position:fixed;top:calc(var(--topH)+8px);left:10px;right:10px;z-index:300;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#successPopup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);z-index:600;background:var(--card);border-radius:var(--rl);box-shadow:0 16px 48px rgba(0,0,0,.25);padding:32px 36px;text-align:center;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.4,0,.2,1)}
#successPopup.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#successPopup .sp-ico{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
#successPopup .sp-ico svg{width:30px;height:30px;color:#fff}
#successPopup .sp-msg{font-size:1.1rem;font-weight:700;color:var(--txt);margin-bottom:4px}
#successPopup .sp-sub{font-size:.82rem;color:var(--mut);font-weight:500}
.toast{padding:10px 14px;border-radius:var(--r);font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:ti .3s ease forwards;pointer-events:auto;max-width:100%}
.toast.out{animation:to .25s ease forwards}
.toast svg{width:17px;height:17px;flex-shrink:0}
.t-ok{background:var(--ok);color:#fff}.t-err{background:var(--err);color:#fff}
.t-warn{background:var(--warn);color:#fff}.t-info{background:var(--pri);color:#fff}
@keyframes ti{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes to{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-12px)}}

.alert{display:flex;align-items:flex-start;gap:7px;padding:10px 12px;border-radius:var(--r);margin-bottom:10px;font-size:.8rem;font-weight:500;line-height:1.6}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
.al-err{background:var(--err-s);color:var(--err)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--rf);font-size:.82rem;font-weight:600;transition:all var(--tr);white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn-p{background:var(--pri);color:#fff}.btn-s{background:var(--ok);color:#fff}
.btn-d{background:var(--err);color:#fff}.btn-o{background:transparent;border:1.5px solid var(--bdr);color:var(--txt)}
.btn-sm{padding:7px 12px;font-size:.76rem}
.btn-xs{padding:5px 9px;font-size:.7rem;border-radius:8px}
.btn svg{width:14px;height:14px}.btn-block{width:100%}

.fg{margin-bottom:10px}.fl{display:block;font-size:.74rem;font-weight:600;margin-bottom:4px;color:var(--mut)}
.fsel,.finp{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:var(--r);background:var(--card);font-size:.84rem;outline:none;transition:border-color var(--tr);appearance:none}
.fsel:focus,.finp:focus{border-color:var(--pri)}
.sw{position:relative}
.sw::after{content:'';position:absolute;top:50%;transform:translateY(-50%);border-inline-end:5px solid transparent;border-inline-start:5px solid transparent;border-top:6px solid var(--mut);pointer-events:none}
html[dir=rtl] .sw::after{left:13px}html[dir=ltr] .sw::after{right:13px}

.ph-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-radius:var(--r);margin-bottom:6px;box-shadow:var(--sh-s);transition:all var(--tr)}
.ph-row:active{transform:scale(.985)}
.ph-av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;color:#fff;flex-shrink:0}
.ph-inf{flex:1;min-width:0}
.ph-nm{font-weight:600;font-size:.82rem;white-space:normal;word-break:break-word;line-height:1.4}
.ph-id{font-size:.68rem;color:var(--mut);font-family:'Noto Sans',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rpt-tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow-x:auto;display:block;box-shadow:var(--sh-s);margin-bottom:14px}
.rpt-tbl thead,.rpt-tbl tbody,.rpt-tbl tr,.rpt-tbl td,.rpt-tbl th{display:block}
.rpt-tbl thead{position:sticky;top:0;z-index:1}
.rpt-tbl tr{display:flex;padding:0;border-bottom:1px solid var(--bdr)}
.rpt-tbl tr:last-child{border-bottom:none}
.rpt-tbl td,.rpt-tbl th{flex:1;min-width:0;padding:8px 6px;font-size:.76rem;white-space:normal;word-break:break-word;border-top:none;text-align:center}
.rpt-tbl th{background:var(--bg);font-weight:600;color:var(--mut)}
.rpt-tbl td{font-size:.78rem}
.rpt-tbl tr:active{background:var(--bg)}

.brk-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);margin-bottom:5px;background:var(--bg)}
.brk-info{flex:1;min-width:0}.brk-name{font-weight:600;font-size:.8rem;white-space:normal;word-break:break-word}.brk-meta{font-size:.7rem;color:var(--mut)}

.empty{text-align:center;padding:28px 16px;color:var(--mut)}
.empty svg{width:40px;height:40px;margin-bottom:8px;opacity:.35}
.empty p{font-size:.84rem}

.pbar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:3px}
.pfill{height:100%;border-radius:2px;transition:width .4s}

.stitle{font-size:.86rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.stitle svg{width:15px;height:15px;color:var(--pri)}

@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ai{animation:fu .3s ease both}
.ai:nth-child(1){animation-delay:.02s}.ai:nth-child(2){animation-delay:.04s}
.ai:nth-child(3){animation-delay:.06s}.ai:nth-child(4){animation-delay:.08s}
.ai:nth-child(5){animation-delay:.1s}.ai:nth-child(6){animation-delay:.12s}
.ai:nth-child(7){animation-delay:.14s}.ai:nth-child(8){animation-delay:.16s}
.ai:nth-child(9){animation-delay:.18s}.ai:nth-child(10){animation-delay:.2s}
.ai:nth-child(11){animation-delay:.22s}

.hidden{display:none!important}
.mt-12{margin-top:12px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.flex{display:flex}.gap-8{gap:8px}

/* شاشة تسجيل الدخول */
#loginScreen{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border-radius:var(--rl);box-shadow:var(--sh-m);padding:28px 20px;max-width:380px;width:100%;text-align:center}
.login-logo{width:60px;height:60px;border-radius:16px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:1.5rem;font-weight:700;font-family:'Noto Sans',sans-serif}
.login-title{font-size:1.05rem;font-weight:700;margin-bottom:4px;color:var(--txt)}
.login-sub{font-size:.76rem;color:var(--mut);margin-bottom:16px}
.login-fg{margin-bottom:14px;text-align:start}
.login-fg .fl{font-size:.76rem;font-weight:600;margin-bottom:5px;color:var(--mut);display:block}
.login-fg .finp{width:100%;padding:12px 14px;border:1.5px solid var(--bdr);border-radius:var(--r);font-size:.9rem;background:var(--card);outline:none;transition:border-color var(--tr)}
.login-fg .finp:focus{border-color:var(--pri)}
.login-btn{width:100%;padding:13px;border-radius:var(--rf);font-size:.9rem;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;border:none;transition:all var(--tr);margin-top:6px}
.login-btn:active{transform:scale(.97)}
.login-err{color:var(--err);font-size:.78rem;font-weight:600;margin-top:8px;display:none}
.login-err.show{display:block}
.role-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--rf);font-size:.68rem;font-weight:700;margin-left:8px}
.role-admin{background:#E8384F18;color:#E8384F}
.role-supervisor{background:#F7B92818;color:#B8860B}
.role-member{background:#1877F218;color:#1877F2}
html[dir=ltr] .role-badge{margin-left:0;margin-right:8px}
/* أيقونة تسجيل الخروج */
.logout-btn{font-size:.68rem;font-weight:700;background:var(--err-s);color:var(--err);width:auto!important;padding:0 10px;font-family:'Noto Sans',sans-serif;border-radius:var(--rf)}
/* === قائمة الخيارات المنبثقة === */
#moreMenu{position:absolute;top:calc(var(--topH) - 2px);z-index:150;background:var(--card);border-radius:var(--r);box-shadow:var(--sh-m);min-width:180px;overflow:hidden;display:none;animation:fu .2s ease}
#moreMenu.show{display:block}
html[dir=rtl] #moreMenu{left:10px}
html[dir=ltr] #moreMenu{right:10px}
.mm-item{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:.84rem;font-weight:600;cursor:pointer;transition:background .15s;color:var(--txt);border:none;background:none;width:100%;text-align:inherit;font-family:inherit}
.mm-item:hover,.mm-item:active{background:var(--bg)}
.mm-item svg{width:17px;height:17px;flex-shrink:0}
.mm-item.mm-danger{color:var(--err)}
.mm-item.mm-danger:hover{background:var(--err-s)}
.mm-div{height:1px;background:var(--bdr);margin:0}
/* شريط معلومات المستخدم */
.user-bar{display:flex;align-items:center;gap:7px;background:var(--card);border-radius:var(--r);padding:7px 10px;margin-bottom:10px;box-shadow:var(--sh-s)}
.user-bar .user-avatar{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;color:#fff;flex-shrink:0}
.user-bar .user-info{flex:1;min-width:0}
.user-bar .user-name{font-weight:700;font-size:.8rem;white-space:normal;word-break:break-word}
.user-bar .user-role{font-size:.66rem;color:var(--mut)}
/* زر التبديل بين تسجيل الدخول وإنشاء حساب */
.login-switch{font-size:.82rem;color:var(--pri);cursor:pointer;font-weight:600;margin-top:12px;display:inline-block;background:none;border:none;text-decoration:underline}
.login-switch:active{opacity:.7}
/* شارة المستخدم المعلق */
.pending-badge{background:var(--warn-s);color:var(--warn);padding:2px 8px;border-radius:var(--rf);font-size:.68rem;font-weight:700}
/* شريط الطلب المعلق */
.req-card{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-radius:var(--r);margin-bottom:6px;box-shadow:var(--sh-s);border-right:4px solid var(--warn)}
html[dir=ltr] .req-card{border-right:none;border-left:4px solid var(--warn)}
.req-card .req-info{flex:1;min-width:0}
.req-card .req-name{font-weight:700;font-size:.86rem}
.req-card .req-meta{font-size:.72rem;color:var(--mut)}
/* === تأكيد المسح === */

<script>
/* ========== تحويل الأرقام العربية إلى إنجليزية ========== */
function toEN(str) {
  if(!str) return str;
  return String(str).replace(/[\u0660-\u0669]/g, function(c){return c.charCodeAt(0)-0x0660})
    .replace(/[\u06F0-\u06F9]/g, function(c){return c.charCodeAt(0)-0x06F0});
}

/* ========== ثوابت الأقسام ========== */
var FLOORS = [
  {id:'icu',en:'RCU',ar:'العناية المركزة',icon:'heart-pulse',clr:'#E8384F'},
  {id:'dialysis',en:'Dialysis',ar:'غسيل الكلى',icon:'droplets',clr:'#7C4DFF'},
  {id:'f2',en:'Floor 2',ar:'الطابق 2',icon:'layers',clr:'#1877F2'},
  {id:'f3',en:'Floor 3',ar:'الطابق 3',icon:'layers',clr:'#00ACC1'},
  {id:'f4',en:'Floor 4',ar:'الطابق 4',icon:'layers',clr:'#43A047'},
  {id:'nicu',en:'NICU',ar:'حديثي الولادة',icon:'baby',clr:'#FF7043'},
  {id:'f5',en:'Floor 5',ar:'الطابق 5',icon:'layers',clr:'#5C6BC0'},
  {id:'f6',en:'Floor 6',ar:'الطابق 6',icon:'layers',clr:'#26A69A'},
  {id:'f8',en:'Floor 8',ar:'الطابق 8',icon:'layers',clr:'#EF6C00'},
  {id:'f9',en:'Floor 9',ar:'الطابق 9',icon:'layers',clr:'#8D6E63'},
  {id:'f10',en:'Floor 10',ar:'الطابق 10',icon:'layers',clr:'#546E7A'}
];

/* ========== طوابق المسائي (الوسطي) ========== */
var EVENING_FLOORS = [
  {id:'ev_icu_dial',en:'RCU + Dialysis',ar:'العناية المركزة + غسيل الكلى',icon:'heart-pulse',clr:'#E8384F',subs:['icu','dialysis']},
  {id:'ev_f2',en:'Floor 2',ar:'الطابق الثاني',icon:'layers',clr:'#1877F2',subs:['f2']},
  {id:'ev_f4',en:'Floor 4',ar:'الطابق الرابع',icon:'layers',clr:'#43A047',subs:['f4']},
  {id:'ev_f5_3',en:'Floor 5 + 3',ar:'الطابق الخامس مع الثالث',icon:'layers',clr:'#5C6BC0',subs:['f5','f3']},
  {id:'ev_f6_8',en:'Floor 6 + 8',ar:'الطابق السادس مع الثامن',icon:'layers',clr:'#26A69A',subs:['f6','f8']},
  {id:'ev_f9_10',en:'Floor 9 + 10',ar:'الطابق التاسع مع العاشر',icon:'layers',clr:'#EF6C00',subs:['f9','f10']}
];

/* ========== طوابق خفر المبيت ========== */
var OVERNIGHT_FLOORS = [
  {id:'ov_surg',en:'Surgical (2+3+5)',ar:'طوابق الجراحية (2+3+5)',icon:'syringe',clr:'#1877F2',subs:['f2','f3','f5']},
  {id:'ov_med',en:'Medical (6+8+9+10)',ar:'طوابق الباطنية (6+8+9+10)',icon:'stethoscope',clr:'#43A047',subs:['f6','f8','f9','f10']}
];

var ACOLS = ['#1877F2','#E8384F','#7C4DFF','#00ACC1','#43A047','#FF7043','#5C6BC0','#26A69A','#EF6C00','#F7B928','#8D6E63','#546E7A','#E91E63','#009688','#3F51B5','#FF5722','#607D8B','#795548','#9C27B0','#4CAF50','#FF9800'];

/* ========== نظام المستخدمين والصلاحيات ========== */
/*
  الأدوار:
  admin    = مدير: ترخيص كامل + المسح
  supervisor = مسؤول: مشاهدة الحضور فقط، رفع إجازات بطابقه فقط، لا يرى الصيادلة، يرى تقارير الاستراحات/الإجازات/الجدول، يضيف بالجدول الصباحي لطابقه بموافقة المدير
  member   = عضو: مشاهدة الجدول، رصيد استراحاته، عدد إجازاته، تقارير الاستراحات
*/
var USERS = [
  {id:'U001', username:'admin', password:'admin', role:'admin', name:{ar:'المدير',en:'Admin'}, floor:null, clr:'#E8384F', status:'active'}
];

/* طلبات التسجيل المعلقة */
var PENDING_USERS = [];

/* المستخدم الحالي */
var currentUser = null;

/* دالة تسجيل الدخول */
function doLogin(username, password) {
  var u = USERS.find(function(x) { return x.username === username && x.password === password && x.status !== 'pending'; });
  if(!u) return false;
  currentUser = u;
  return true;
}

/* دالة إنشاء حساب جديد */
function doSignup(name, username, password, role, floor) {
  /* التحقق من عدم تكرار اسم المستخدم */
  var existsInUsers = USERS.find(function(x) { return x.username === username; });
  var existsInPending = PENDING_USERS.find(function(x) { return x.username === username; });
  if(existsInUsers || existsInPending) return 'username_exists';
  if(!name || !username || !password) return 'fields_required';
  if(username.length < 3) return 'username_short';
  if(password.length < 4) return 'password_short';
  var newId = 'U' + Date.now();
  var clr = ACOLS[Math.floor(Math.random() * ACOLS.length)];
  var newPending = {
    id: newId,
    username: username,
    password: password,
    role: role || 'member',
    name: {ar: name, en: name},
    floor: role === 'supervisor' ? floor : null,
    clr: clr,
    status: 'pending',
    requestedAt: todayStr()
  };
  PENDING_USERS.push(newPending);
  /* إضافة أيضاً إلى USERS بحالة معلقة حتى لا يتكرر اسم المستخدم */
  USERS.push(newPending);
  return 'success';
}

/* دالة موافقة المدير على حساب معلق */
function doApproveUser(userId, role, floor, code, cat, phone) {
  var pending = PENDING_USERS.find(function(x) { return x.id === userId; });
  if(!pending) return false;
  /* تحديث البيانات */
  pending.status = 'active';
  pending.role = role || pending.role;
  if(role === 'supervisor') {
    pending.floor = floor || pending.floor;
  } else if(role === 'admin') {
    pending.floor = null;
  } else {
    pending.floor = floor || pending.floor || null;
  }
  /* تحديث في USERS أيضاً */
  var userInList = USERS.find(function(x) { return x.id === userId; });
  if(userInList) {
    userInList.status = 'active';
    userInList.role = pending.role;
    userInList.floor = pending.floor;
  }
  /* إزالة من المعلقين */
  PENDING_USERS = PENDING_USERS.filter(function(x) { return x.id !== userId; });
  /* إضافة كصيدلي جديد في قائمة الصيادلة */
  var newPharmId = code || ('PH' + Date.now().toString().slice(-6));
  /* التحقق من عدم تكرار رقم البصمة */
  var codeExists = S.pharms.find(function(p) { return p.id === newPharmId; });
  if(codeExists) {
    newPharmId = 'PH' + Date.now().toString().slice(-6);
  }
  var assignedFloor = pending.floor || floor;
  var newPharm = {
    id: newPharmId,
    en: pending.name.en || pending.name.ar,
    ar: pending.name.ar || pending.name.en,
    fl: assignedFloor || 'icu',
    clr: pending.clr || ACOLS[Math.floor(Math.random() * ACOLS.length)],
    restCredits: 0,
    addedCredits: 0,
    cat: cat || '',
    phone: phone || ''
  };
  S.pharms.push(newPharm);
  /* ربط العضو بالصيدلي */
  if(role === 'member' && userInList) {
    userInList.linkedPid = newPharmId;
    userInList.floor = assignedFloor;
  }
  if(role === 'supervisor' && userInList) {
    userInList.floor = floor || pending.floor;
  }
  return true;
}

/* دالة رفض حساب معلق */
function doRejectUser(userId) {
  /* إزالة من المعلقين */
  PENDING_USERS = PENDING_USERS.filter(function(x) { return x.id !== userId; });
  /* إزالة من USERS */
  USERS = USERS.filter(function(x) { return x.id !== userId; });
  return true;
}

}

}

/* هل يمكن تعديل الحضور في تاريخ محدد؟ (4 أيام دوام سابقة + اليوم) */
/* المنطق: عد أيام الدوام المسجلة بعد التاريخ المطلوب؛ إذا كان العدد ≤ 4 فالتاريخ قابل للتعديل */
function canEditAttDate(dateStr) {
  if(!isAdmin()) return false;
  if(!dateStr || dateStr === todayStr()) return true;
  var today = todayStr();
  if(dateStr > today) return false; /* تواريخ مستقبلية غير قابلة للتعديل */
  /* عد أيام الدوام (المسجّل فيها حضور فعلي) التي تلي التاريخ المطلوب */
  var workDaysAfter = 0;
  Object.keys(S.attHistory).forEach(function(d) {
    if(d > dateStr && d <= today) {
      var rec = S.attHistory[d];
      var hasPharm = false;
      Object.keys(rec).forEach(function(sh) {
        Object.keys(rec[sh] || {}).forEach(function(fl) {
          if(Array.isArray(rec[sh][fl])) rec[sh][fl].forEach(function(id) { if(id) hasPharm = true; });
        });
      });
      if(hasPharm) workDaysAfter++;
    }
  });
  return workDaysAfter <= 4;
}

/* الحصول على صفوف الحضور للتعديل (تقوم بإنشاء الهيكل إذا لم يكن موجوداً) */
function getAttEditRows(sh, dateStr) {
  var today = todayStr();
  if(!dateStr || dateStr === today) {
    return sh==='morning' ? S.mRows : sh==='evening' ? S.eRows : S.oRows;
  }
  /* تاريخ سابق: إنشاء هيكل في attHistory إذا لم يكن موجوداً */
  if(!S.attHistory[dateStr]) S.attHistory[dateStr] = {};
  if(!S.attHistory[dateStr][sh]) {
    var fls = sh==='morning' ? FLOORS : sh==='evening' ? EVENING_FLOORS : OVERNIGHT_FLOORS;
    S.attHistory[dateStr][sh] = {};
    fls.forEach(function(f) {
      S.attHistory[dateStr][sh][f.id] = [null];
    });
  }
  return S.attHistory[dateStr][sh];
}

function canSeeStaff() { return isAdmin() || isSupervisor(); }

  return null;
}

/* المسؤول: هل يملك صلاحية على طابق معين؟ */
function canAccessFloor(floorId) {
  if(isAdmin()) return true;
  if(isSupervisor()) {
    var myFloor = currentUser.floor;
    /* التحقق من الطوابق المجمعة */
    var allFloorIds = [myFloor];
    EVENING_FLOORS.forEach(function(ef) {
      if(ef.subs && ef.subs.indexOf(myFloor) !== -1) {
        ef.subs.forEach(function(s) { if(allFloorIds.indexOf(s)===-1) allFloorIds.push(s); });
      }
    });
    OVERNIGHT_FLOORS.forEach(function(of) {
      if(of.subs && of.subs.indexOf(myFloor) !== -1) {
        of.subs.forEach(function(s) { if(allFloorIds.indexOf(s)===-1) allFloorIds.push(s); });
      }
    });
    return allFloorIds.indexOf(floorId) !== -1;
  }
  return false;
}

function t(k) { return T[S.lang][k] || k; }

/* دالة نوع الإجازة للتصدير */
function getLvTypeLabel(l) {
  var lvTypeKey = l.lvType || 'regular';
  return t('lvType'+lvTypeKey.charAt(0).toUpperCase()+lvTypeKey.slice(1));
}

/* دالة اسم الطابق */
function flrName(id) {
  var f = FLOORS.find(function(x){return x.id===id});
  if(f) return toEN(S.lang==='ar'?f.ar:f.en);
  f = EVENING_FLOORS.find(function(x){return x.id===id});
  if(f) return toEN(S.lang==='ar'?f.ar:f.en);
  f = OVERNIGHT_FLOORS.find(function(x){return x.id===id});
  if(f) return toEN(S.lang==='ar'?f.ar:f.en);
  return id;
}

function getShiftFloors(sh) {
  if(sh==='evening') return EVENING_FLOORS;
  if(sh==='overnight') return OVERNIGHT_FLOORS;
  return FLOORS;
}

function phName(p) { return toEN(p.ar); }

/* دالة معرفة جداول الصيدلي */
function phShifts(pid) {
  var shifts = [];
  Object.keys(S.mRows).forEach(function(k) { if(S.mRows[k] && S.mRows[k].indexOf(pid) !== -1) shifts.push('morning'); });
  Object.keys(S.eRows).forEach(function(k) { if(S.eRows[k] && S.eRows[k].indexOf(pid) !== -1) shifts.push('evening'); });
  Object.keys(S.oRows).forEach(function(k) { if(S.oRows[k] && S.oRows[k].indexOf(pid) !== -1) shifts.push('overnight'); });
  /* إزالة التكرار */
  return shifts.filter(function(v, i, a) { return a.indexOf(v) === i; });
}
function nowTime() { var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function todayStr() { var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function curMonth() { return new Date().getMonth(); }
function curYear() { return new Date().getFullYear(); }
function fmtDate(d) {
  /* استخدام الأرقام الإنجليزية دائماً */
  if(S.lang==='ar') return toEN(d.toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',year:'numeric',month:'long',day:'numeric'}));
  return d.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

/* تنسيق تاريخ الطباعة: اليوم + التاريخ + السنة فقط */
function fmtPrintDate(d) {
  var dayName = S.lang==='ar' ? toEN(d.toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long'})) : d.toLocaleDateString('en-US',{weekday:'long'});
  var dd = String(d.getDate()).padStart(2,'0');
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var yyyy = d.getFullYear();
  return dayName + '  ' + yyyy + '/' + mm + '/' + dd;
}

function getMonthLeaves(pid) {
  /* حساب عدد أيام الإجازة في الشهر الحالي (الحد 3 أيام) - بدون الاستراحات */
  return S.leaves.filter(function(l) {
    return l.pid === pid && l.status !== 'rejected' && l.lvType !== 'rest';
  }).filter(function(l) {
    var d = new Date(l.date);
    return d.getMonth() === curMonth() && d.getFullYear() === curYear();
  });
}

};

/* تهيئة صفوف الحضور فقط */
FLOORS.forEach(function(f) {
  var arr5 = []; for(var i=0;i<5;i++) arr5.push(null);
  S.mRows[f.id] = arr5;
});
EVENING_FLOORS.forEach(function(f) {
  S.eRows[f.id] = [null];
});
OVERNIGHT_FLOORS.forEach(function(f) {
  S.oRows[f.id] = [null];
});

function assignedIds(sh) {
  var rows = sh==='morning' ? S.mRows : sh==='evening' ? S.eRows : S.oRows;
  var s = new Set();
  Object.keys(rows).forEach(function(k) {
    rows[k].forEach(function(id) { if(id) s.add(id); });
  });
  return s;
}

/* --- دالة الحصول على صفوف الحضور لتاريخ محدد --- */
function getAttRowsForDate(sh, dateStr) {
  if(!dateStr) {
    return sh==='morning' ? S.mRows : sh==='evening' ? S.eRows : S.oRows;
  }
  if(!S.attHistory[dateStr]) return null;
  return S.attHistory[dateStr][sh] || null;
}

/* --- دالة حفظ صفوف الحضور لتاريخ محدد --- */
function setAttRowsForDate(sh, dateStr, rows) {
  if(!dateStr) return;
  if(!S.attHistory[dateStr]) S.attHistory[dateStr] = {};
  S.attHistory[dateStr][sh] = JSON.parse(JSON.stringify(rows));
}

/* --- دالة حفظ بيانات اليوم الحالي في السجل --- */
function saveCurrentAttToHistory() {
  var today = todayStr();
  if(!S.attHistory[today]) S.attHistory[today] = {};
  S.attHistory[today].morning = JSON.parse(JSON.stringify(S.mRows));
  S.attHistory[today].evening = JSON.parse(JSON.stringify(S.eRows));
  S.attHistory[today].overnight = JSON.parse(JSON.stringify(S.oRows));
}

/* --- دالة الحصول على صفوف الحضور للعرض (تاريخ محدد أو اليوم) --- */
function getAttDisplayRows(sh, selDate) {
  var today = todayStr();
  if(!selDate || selDate === today) {
    return sh==='morning' ? S.mRows : sh==='evening' ? S.eRows : S.oRows;
  }
  /* تاريخ سابق: قراءة من السجل بدون تعديل البيانات الحالية */
  var hist = S.attHistory[selDate];
  if(hist && hist[sh]) {
    return hist[sh];
  }
  return {};
}

/* ========== الإشعارات ========== */
function toast(msg, type) {
  type = type || 'info';
  if(type === 'error') { showErrorAlert(msg); return; }
  var c = document.getElementById('toasts');
  var icons = {success:'check-circle',error:'x-circle',warning:'alert-triangle',info:'info'};
  var el = document.createElement('div');
  var cls = type==='success'?'t-ok':type==='warning'?'t-warn':'t-info';
  el.className = 'toast ' + cls;
  el.innerHTML = '<i data-lucide="'+(icons[type]||'info')+'"></i><span>'+toEN(msg)+'</span>';
  c.appendChild(el);
  lucide.createIcons({nodes:[el]});
  setTimeout(function() { el.classList.add('out'); setTimeout(function() { el.remove(); }, 250); }, 3000);
}

/* ========== تنبيه خطأ مركزي ========== */
var _errTimer = null;
function showErrorAlert(msg) {
  var popup = document.getElementById('successPopup');
  var ico = document.getElementById('spIco');
  var msgEl = document.getElementById('spMsg');
  var subEl = document.getElementById('spSub');
  ico.style.background = 'var(--err)';
  ico.innerHTML = '<i data-lucide="alert-circle"></i>';
  msgEl.textContent = toEN(msg);
  msgEl.style.color = 'var(--err)';
  subEl.textContent = '';
  lucide.createIcons({nodes:[ico]});
  popup.classList.add('show');
  if(_errTimer) clearTimeout(_errTimer);
  _errTimer = setTimeout(function() { popup.classList.remove('show'); msgEl.style.color = 'var(--txt)'; }, 3500);
}

/* ========== نافذة نجاح صغيرة مركزية ========== */
var _spTimer = null;
function showSuccessPopup(msg, sub, color) {
  var popup = document.getElementById('successPopup');
  var ico = document.getElementById('spIco');
  var msgEl = document.getElementById('spMsg');
  var subEl = document.getElementById('spSub');
  var clr = color || 'var(--ok)';
  ico.style.background = clr;
  ico.innerHTML = '<i data-lucide="check-circle"></i>';
  msgEl.textContent = toEN(msg);
  msgEl.style.color = 'var(--txt)';
  subEl.textContent = sub ? toEN(sub) : '';
  lucide.createIcons({nodes:[ico]});
  popup.classList.add('show');
  if(_spTimer) clearTimeout(_spTimer);
  _spTimer = setTimeout(function() { popup.classList.remove('show'); }, 2200);
}

/* ========== نافذة سجل أيام الحضور (رصيد الاستراحات) ========== */
function showAttLogModal(pid) {
  var p = S.pharms.find(function(x){return x.id===pid});
  if(!p) return;
  var isAr = S.lang === 'ar';
  var logEntries = S.attendanceLog.filter(function(e){ return e.pid === pid; });
  /* ترتيب تنازلي حسب التاريخ */
  logEntries.sort(function(a,b){ return b.date.localeCompare(a.date); });

  var totalCredits = 0;
  logEntries.forEach(function(e){ totalCredits += e.credits; });

  var html = '<div style="padding:16px;max-height:80vh;overflow-y:auto">';
  html += '<h3 style="font-size:1rem;font-weight:700;margin-bottom:4px;text-align:center"><i data-lucide="calendar-check" style="width:18px;height:18px;vertical-align:middle;margin-'+(isAr?'left':'right')+':6px"></i>'+t('attLogTitle')+'</h3>';
  html += '<p style="font-size:.78rem;color:var(--mut);text-align:center;margin-bottom:14px">'+phName(p)+' · '+p.id+'</p>';

  /* إجمالي الرصيد */
  html += '<div style="background:var(--pri-s);border:1.5px solid var(--pri);border-radius:12px;padding:12px;margin-bottom:14px;text-align:center">';
  html += '<div style="font-size:.72rem;color:var(--pri);font-weight:600">'+t('attLogTotal')+'</div>';
  html += '<div style="font-size:1.6rem;font-weight:800;color:var(--pri)">'+totalCredits+'</div>';
  html += '</div>';

  if(logEntries.length === 0) {
    html += '<div style="text-align:center;padding:30px 0;color:var(--mut)">';
    html += '<i data-lucide="calendar-x" style="width:40px;height:40px;margin-bottom:8px;opacity:.4"></i>';
    html += '<p style="font-size:.85rem">'+t('attLogEmpty')+'</p>';
    html += '</div>';
  } else {
    /* جدول الأيام */
    html += '<div style="display:flex;gap:6px;margin-bottom:10px;padding:0 4px">';
    html += '<span style="flex:1;font-size:.7rem;font-weight:700;color:var(--mut)">'+t('attLogDate')+'</span>';
    html += '<span style="width:70px;font-size:.7rem;font-weight:700;color:var(--mut)">'+t('attLogShift')+'</span>';
    html += '<span style="width:50px;text-align:center;font-size:.7rem;font-weight:700;color:var(--mut)">'+t('attLogCredits')+'</span>';
    html += '</div>';

    logEntries.forEach(function(entry, i) {
      var shiftLabel = entry.shift === 'morning' ? t('attLogMorning') : entry.shift === 'evening' ? t('attLogEvening') : t('attLogOvernight');
      var shiftColor = entry.shift === 'morning' ? '#F7B928' : entry.shift === 'evening' ? '#7C4DFF' : '#1877F2';
      var shiftIcon = entry.shift === 'morning' ? 'sun' : entry.shift === 'evening' ? 'sunset' : 'moon';
      var bgColor = i % 2 === 0 ? 'var(--bg2)' : 'var(--card)';
      var isUsed = entry.usedForBreak;
      var dateObj = new Date(entry.date + 'T00:00:00');
      var dateLabel = dateObj.getFullYear() + '/' + String(dateObj.getMonth()+1).padStart(2,'0') + '/' + String(dateObj.getDate()).padStart(2,'0');
      var dayNames = isAr ? ['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      var dayName = dayNames[dateObj.getDay()];

      html += '<div style="display:flex;align-items:center;gap:6px;padding:10px 8px;border-radius:10px;background:'+bgColor+';margin-bottom:6px;opacity:'+(isUsed?'0.5':'1')+'">';
      html += '<div style="flex:1;min-width:0">';
      html += '<div style="font-size:.82rem;font-weight:600">'+dateLabel+'</div>';
      html += '<div style="font-size:.68rem;color:var(--mut)">'+dayName+' · '+flrName(entry.floor)+'</div>';
      html += '</div>';
      html += '<div style="width:70px;display:flex;align-items:center;gap:4px;justify-content:center">';
      html += '<i data-lucide="'+shiftIcon+'" style="width:14px;height:14px;color:'+shiftColor+'"></i>';
      html += '<span style="font-size:.78rem;font-weight:600;color:'+shiftColor+'">'+shiftLabel+'</span>';
      html += '</div>';
      html += '<div style="width:50px;text-align:center">';
      html += '<span style="display:inline-block;background:'+shiftColor+'18;color:'+shiftColor+';font-weight:700;font-size:.82rem;padding:3px 8px;border-radius:8px">+'+entry.credits+'</span>';
      html += '</div>';
      if(isUsed) {
        html += '<i data-lucide="check-circle" style="width:16px;height:16px;color:var(--ok);flex-shrink:0" title="'+t('brkUsedFrom')+'"></i>';
      }
      html += '</div>';
    });
  }

  html += '<button class="btn btn-o" data-mact="close-modal" style="width:100%;margin-top:10px">'+t('cancel')+'</button>';
  html += '</div>';

var _calMonth = null; /* الشهر المعروض YYYY-MM */
function showCalendarModal(selDate) {
  var today = todayStr();
  var active = selDate || S.attSelectedDate || today;
  var now = new Date();
  _calMonth = _calMonth || (now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  var isAr = S.lang==='ar';
  var wdShort = isAr ? ['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var html = '<div class="cal-modal">';
  /* رأس التقويم */
  html += '<div class="cal-head">';
  html += '<button class="cal-nav-btn" id="calPrev"><i data-lucide="chevron-right"></i></button>';
  html += '<span class="cal-title" id="calTitle"></span>';
  html += '<button class="cal-nav-btn" id="calNext"><i data-lucide="chevron-left"></i></button>';
  html += '</div>';
  /* أيام الأسبوع */
  html += '<div class="cal-weekdays">';
 wdShort.forEach(function(w){ html += '<span class="cal-wd">'+w+'</span>'; });
  html += '</div>';
  /* أيام الشهر */
  html += '<div class="cal-days" id="calDays"></div>';
  /* زر العودة لليوم */
  html += '<button class="cal-today-btn" id="calTodayBtn"><i data-lucide="calendar-check"></i> '+t('calToday')+'</button>';
  html += '</div>';
  showModal(html);
  /* رسم التقويم */
  window._renderCal = function() {
    var parts = _calMonth.split('-');
    var y = parseInt(parts[0]), m = parseInt(parts[1])-1;
    var firstDay = new Date(y,m,1).getDay();
    var daysInMonth = new Date(y,m+1,0).getDate();
    var daysInPrev = new Date(y,m,0).getDate();
    var monthName = isAr ? MONTH_NAMES_AR[m] : MONTH_NAMES_EN[m];
    document.getElementById('calTitle').textContent = monthName + ' ' + y;
    var daysEl = document.getElementById('calDays');
    daysEl.innerHTML = '';
    /* أيام الشهر السابق */
    for(var i=firstDay-1;i>=0;i--) {
      var d = daysInPrev-i;
      var el = document.createElement('div');
      el.className = 'cal-day other-month';
      el.textContent = d;
      daysEl.appendChild(el);
    }
    /* أيام الشهر الحالي */
    for(var d=1;d<=daysInMonth;d++) {
      var ds = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var dt = new Date(ds+'T00:00:00');
      var el = document.createElement('div');
      el.className = 'cal-day';
      el.textContent = d;
      /* هل هو اليوم؟ */
      if(ds===today) el.classList.add('today');
      /* هل هو المختار؟ */
      if(ds===active) el.classList.add('selected');
      /* هل في المستقبل؟ */
      if(ds>today) el.classList.add('future');
      /* هل فيه بيانات؟ */
      var hasData = false;
      if(S.attHistory[ds]) {
        var rec = S.attHistory[ds];
        Object.keys(rec).forEach(function(shKey){
          var shData = rec[shKey];
          Object.keys(shData||{}).forEach(function(flId){
            if(Array.isArray(shData[flId])) shData[flId].forEach(function(id){if(id)hasData=true;});
          });
        });
      }
      if(hasData) el.classList.add('has-data');
      /* هل قابل للتعديل؟ */
      if(ds<=today && canEditAttDate(ds)) {
        el.classList.add('editable');
      } else if(ds<today) {
        el.classList.add('readonly');
      }
      /* النقر */
      (function(dateStr){
        el.addEventListener('click',function(){
          saveCurrentAttToHistory();
          S.attSelectedDate = dateStr===today ? null : dateStr;
          hideModal();
          renderScreen();
        });
      })(ds);
      daysEl.appendChild(el);
    }
    /* أيام الشهر التالي */
    var totalCells = firstDay + daysInMonth;
    var remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
    for(var i=1;i<=remaining;i++) {
      var el = document.createElement('div');
      el.className = 'cal-day other-month';
      el.textContent = i;
      daysEl.appendChild(el);
    }
    lucide.createIcons({nodes:[document.getElementById('mSheet')]});
  };
  window._renderCal();
  /* التنقل بين الأشهر */
  document.getElementById('calPrev').addEventListener('click',function(){
    var parts=_calMonth.split('-'); var y=parseInt(parts[0]),m=parseInt(parts[1]);
    m--; if(m<1){m=12;y--;}
    _calMonth=y+'-'+String(m).padStart(2,'0');
    window._renderCal();
  });
  document.getElementById('calNext').addEventListener('click',function(){
    var parts=_calMonth.split('-'); var y=parseInt(parts[0]),m=parseInt(parts[1]);
    m++; if(m>12){m=1;y++;}
    _calMonth=y+'-'+String(m).padStart(2,'0');
    window._renderCal();
  });
  /* زر اليوم */
  document.getElementById('calTodayBtn').addEventListener('click',function(){
    saveCurrentAttToHistory();
    S.attSelectedDate=null;
    hideModal();
    renderScreen();
  });
}

function checkLeaveAlert(p) {
  var c = getMonthLeaves(p.id).length;
  if(c > 3) {
    var msg = phName(p) + ' (' + p.id + ') — ' + t('leaveAlert') + ' (' + c + '/3)';
    var exists = S.notifs.find(function(n) { return n.msg === msg && n.date === todayStr(); });
    if(!exists) {
      /* إشعار للمدير */
      S.notifs.unshift({id: Date.now(), msg: msg, date: todayStr(), pid: p.id, read: false, forUser: 'admin', isLeaveAlert: true});
      /* إشعار لمسؤول الطابق إذا كان الصيدلي تابعاً لطابق معين */
      var supUser = USERS.find(function(u) { return u.role === 'supervisor' && u.floor === p.fl && u.status === 'active'; });
      if(supUser) {
        S.notifs.unshift({id: Date.now()+1, msg: msg, date: todayStr(), pid: p.id, read: false, forUser: supUser.id, isLeaveAlert: true});
      }
      updBadge();
    }
  }
}
function isNotifForUser(n) {
  /* هل الإشعار موجه للمستخدم الحالي؟ */
  if(!currentUser) return false;
  if(isAdmin()) {
    /* المدير يرى: إشعارات له (forUser='admin') + إشعارات موجهة له بالاسم */
    return n.forUser === 'admin' || n.forUser === currentUser.id;
  }
  if(isSupervisor()) {
    /* المسؤول يرى: إشعارات موجهة له بالاسم + صيادلة طابقه فقط */
    if(n.forUser !== currentUser.id) return false;
    if(n.pid) {
      var nPharm = S.pharms.find(function(x){return x.id===n.pid});
      var supFl = currentUser.floor;
      if(supFl && nPharm && nPharm.fl !== supFl) return false;
    }
    return true;
  }
  if(isMember()) {
    /* العضو يرى: إشعارات متعلقة بصيدليه */
    var mPid = getMemberPid();
    return mPid && n.pid === mPid && n.forUser === currentUser.id;
  }
  return false;
}

function updBadge() {
  var b = document.getElementById('nbadge');
  var c = S.notifs.filter(function(n) { return n.date === todayStr() && !n.read && isNotifForUser(n); }).length;
  if(c > 0) { b.textContent = c; b.classList.remove('hidden'); }
  else { b.classList.add('hidden'); }
}

/* ========== دالة مساعدة لتحميل الملفات ========== */
function downloadBlob(blob, fileName) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.style.display = 'none';
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  setTimeout(function() {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 200);
}

/* ========== تصدير Excel ========== */
function exportExcel(headers, rows, fn) {
  try {
    if(typeof XLSX !== 'undefined') {
      /* إضافة عمود الترقيم */
      var numHeaders = ['#'].concat(headers);
      var numRows = rows.map(function(r, i){ return [i+1].concat(r); });
      var ws_data = [numHeaders].concat(numRows);
      var ws = XLSX.utils.aoa_to_sheet(ws_data);
      var colWidths = numHeaders.map(function(h, idx){ return {wch: idx===0 ? 6 : Math.max(String(h).length*2, 18)}; });
      ws['!cols'] = colWidths;
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
      var wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      var blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      downloadBlob(blob, fn + '.xlsx');
      toast(t('exportSuccess'), 'success');
    } else {
      exportExcelFallback(headers, rows, fn);
    }
  } catch(err) {
    console.error('XLSX export error:', err);
    try { exportExcelFallback(headers, rows, fn); } catch(e2) {
      toast('Excel: ' + e2.message, 'error');
    }
  }
}

/* حل بديل: تصدير كجدول HTML يحفظ كـ xls */
function exportExcelFallback(headers, rows, fn) {
  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">';
  html += '<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Sheet1</x:Name><x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>';
  html += '<table border="1"><thead><tr>';
  html += '<th style="background:#1877F2;color:#fff;font-weight:bold;padding:8px">#</th>';
  headers.forEach(function(h){ html += '<th style="background:#1877F2;color:#fff;font-weight:bold;padding:8px">'+h+'</th>'; });
  html += '</tr></thead><tbody>';
  rows.forEach(function(r, i){
    html += '<tr><td style="padding:6px;font-weight:bold;text-align:center">'+(i+1)+'</td>';
    r.forEach(function(c){ html += '<td style="padding:6px">'+c+'</td>'; });
    html += '</tr>';
  });
  html += '</tbody></table></body></html>';
  var blob = new Blob(['\uFEFF' + html], {type:'application/vnd.ms-excel;charset=utf-8'});
  downloadBlob(blob, fn + '.xls');
  toast(t('exportSuccess'), 'success');
}

  w.document.write('</head><body><h2>'+title+'</h2><p class="sub">'+dateDisplay+'</p><p class="sub" style="font-weight:700;color:#1C1E21;font-size:15px;margin-bottom:20px">'+t('clinicalPharmacyUnit')+'</p>');

/* ========== عرض الشاشات ========== */
function renderScreen() {
  var m = document.getElementById('main');
  var titles = {morning:t('morningShift'),evening:t('eveningShift'),overnight:t('overnightShift'),leave:t('leave'),staff:t('staff'),reports:t('reports'),users:t('userManagement')};
  document.getElementById('pgTitle').textContent = (titles[S.tab] || '') + (currentUser ? ' — '+(S.lang==='ar'?currentUser.name.ar:currentUser.name.en) : '');

  var html = '';
  /* شريط معلومات المستخدم */
  if(currentUser) {
    var uName = S.lang==='ar' ? currentUser.name.ar : currentUser.name.en;
    var uRole = roleLabel(currentUser.role);
    var uRoleClass = roleBadgeClass(currentUser.role);
    html += '<div class="user-bar">';
    html += '<div class="user-avatar" style="background:'+currentUser.clr+'">'+(currentUser.name.en?currentUser.name.en[0]:'?')+'</div>';
    html += '<div class="user-info"><div class="user-name">'+toEN(uName)+'<span class="role-badge '+uRoleClass+'">'+uRole+'</span></div>';
    if(isSupervisor() && currentUser.floor) {
      html += '<div class="user-role">'+flrName(currentUser.floor)+'</div>';
    }
    /* العضو: عرض رصيد استراحاته وعدد إجازاته - قابل للنقر لعرض التفاصيل */
    if(isMember()) {
      var mPid = getMemberPid();
      if(mPid) {
        var mPharm = S.pharms.find(function(x){return x.id===mPid});
        if(mPharm) {
          html += '<div class="user-role" style="cursor:pointer" data-act="show-att-log" title="'+t('attLogTitle')+'">'+t('restCredits')+': <span style="color:var(--pri);font-weight:700;text-decoration:underline">'+((mPharm.restCredits||0)+(mPharm.addedCredits||0))+'</span> · '+t('monthLeaves')+': '+getMonthLeaves(mPid).length+'/3</div>';
        }
      }
    }
    html += '</div></div>';
  }

  switch(S.tab) {
    case 'morning': html += renderAtt('morning'); break;
    case 'evening': html += renderAtt('evening'); break;
    case 'overnight': html += renderAtt('overnight'); break;
    case 'leave': html += renderLeave(); break;
    case 'staff': html += canSeeStaff() ? renderStaff() : '<div class="empty"><i data-lucide="lock"></i><p>'+t('noPermission')+'</p></div>'; break;
    case 'users': html += canManageUsers() ? renderUserManagement() : '<div class="empty"><i data-lucide="lock"></i><p>'+t('noPermission')+'</p></div>'; break;
    case 'reports': html += renderReports(); break;
  }
  m.innerHTML = html;
  lucide.createIcons({nodes:[m]});
}

/* --- شاشة الحضور --- */
function renderAtt(sh) {
  var floors = getShiftFloors(sh);
  var shiftLabel = t(sh + 'Shift');
  var today = todayStr();
  var selDate = S.attSelectedDate || today;
  var isToday = selDate === today;

  /* الحصول على صفوف العرض حسب التاريخ */
  var rows = getAttDisplayRows(sh, selDate);
  /* السماح بالتعديل لليوم و 4 أيام سابقة */
  var canEdit = canEditAttDate(selDate);
  var isHistorical = !isToday;
  /* للمسؤول: عرض فقط بغض النظر عن التاريخ */
  var supFloor = isSupervisor() && currentUser ? currentUser.floor : null;
  if(isSupervisor()) { canEdit = false; }
  if(isSupervisor() && supFloor && sh === 'morning') {
    floors = floors.filter(function(f) { return f.id === supFloor; });
  } else if(supFloor && (sh === 'evening' || sh === 'overnight')) {
    var groupedFloors = sh==='evening' ? EVENING_FLOORS : OVERNIGHT_FLOORS;
    floors = groupedFloors.filter(function(f) { return f.subs && f.subs.indexOf(supFloor) !== -1; });
  }
  /* للتواريخ القابلة للتعديل: إنشاء هيكل الطوابق إذا لم يكن موجوداً */
  if(canEdit && isHistorical) {
    if(!S.attHistory[selDate]) S.attHistory[selDate] = {};
    if(!S.attHistory[selDate][sh]) {
      S.attHistory[selDate][sh] = {};
      floors.forEach(function(f) {
        S.attHistory[selDate][sh][f.id] = [null];
      });
      rows = S.attHistory[selDate][sh];
    }
  }
  var checkedCount = 0;
  Object.keys(rows).forEach(function(k) { if(Array.isArray(rows[k])) rows[k].forEach(function(id) { if(id) checkedCount++; }); });

  var selDateObj = new Date(selDate + 'T00:00:00');
  var selDateLabel = fmtDate(selDateObj);
  var dayIdx = selDateObj.getDay();
  var dayColors = {0:['#FDE8EC','#FA383E'],1:['#E7F3FF','#1877F2'],2:['#E6F9EE','#42B72A'],3:['#FFF8E1','#F7B928'],4:['#EDE7F6','#7C4DFF'],5:['#FFF8E1','#F7B928'],6:['#E7F3FF','#1877F2']};
  var dayDC = dayColors[dayIdx] || ['#F0F2F5','#65676B'];
  /* تحديد ما إذا كان التاريخ قابل للتعديل لعرض المؤشر */
  var isEditableDate = canEditAttDate(selDate);

  var dateStatusLabel = '';
  if(isSupervisor()) {
    dateStatusLabel = ' · '+t('viewOnly');
  } else if(isHistorical && !canEdit) {
    dateStatusLabel = ' · '+(S.lang==='ar'?'عرض سابق (للقراءة فقط)':'Historical (Read-only)');
  } else if(isHistorical && canEdit) {
    dateStatusLabel = ' · '+(S.lang==='ar'?'تعديل سابق':'Past Edit');
  }
  var html = '<div class="scr-hd"><div><h2>'+shiftLabel+'</h2><p class="date-lbl">'+selDateLabel+' · '+checkedCount+' '+t('checkedIn')+dateStatusLabel+'</p></div>';
  if(isEditableDate) {
    html += '<div class="hd-btns">';
    html += '<button class="ibtn" data-act="export-att" data-sh="'+sh+'" data-dt="'+selDate+'" title="'+t('export')+'"><i data-lucide="download"></i></button>';
    html += '<button class="ibtn" data-act="print-att" data-sh="'+sh+'" data-dt="'+selDate+'" title="'+t('print')+'"><i data-lucide="printer"></i></button>';
    html += '</div>';
  }
  html += '</div>';

  /* ===== زر فتح التقويم ===== */
  html += '<div style="background:var(--card);border-radius:var(--rl);padding:10px 14px;margin-bottom:12px;box-shadow:var(--sh-s);display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer" data-act="open-calendar">';
  html += '<div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">';
  html += '<div style="width:36px;height:36px;border-radius:10px;background:var(--pri-s);color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i data-lucide="calendar-days" style="width:18px;height:18px"></i></div>';
  html += '<div style="min-width:0"><div style="font-size:.76rem;font-weight:600;color:var(--mut)">'+t('calSelectDate')+'</div>';
  html += '<div style="font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+selDateLabel+'</div></div>';
  html += '</div>';
  html += '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0">';
  if(!isToday) {
    html += '<span style="display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--ok);background:var(--ok-s);padding:3px 8px;border-radius:var(--rf)"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ok)"></span>'+t('attEditWindow')+'</span>';
  } else {
    html += '<span style="display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--pri);background:var(--pri-s);padding:3px 8px;border-radius:var(--rf)">'+t('attToday')+'</span>';
  }
  html += '<i data-lucide="chevron-down" style="width:16px;height:16px;color:var(--mut)"></i>';
  html += '</div>';
  html += '</div>';

  /* عرض الحضور */
  var hasData = false;
  floors.forEach(function(f) {
    var fr = rows[f.id];
    if(!fr) return;
    var fc = fr.filter(Boolean).length;
    if(fc > 0) hasData = true;
    html += '<div class="flr-sec ai"><div class="flr-hd">';
    html += '<div class="flr-ico" style="background:'+f.clr+'18;color:'+f.clr+'"><i data-lucide="'+f.icon+'"></i></div>';
    html += '<span class="flr-nm">'+toEN(S.lang==='ar'?f.ar:f.en)+'</span>';
    html += '<span style="font-size:.72rem;color:var(--mut)">'+fc+'/'+fr.length+'</span></div>';
    html += '<div class="flr-rows">';
    fr.forEach(function(pid, idx) {
      var p = pid ? S.pharms.find(function(x){return x.id===pid}) : null;
      html += '<div class="att-row"><div class="iwrap">';
      if(canEdit) {
        html += '<input type="text" class="att-in '+(p?'filled':'')+'" placeholder="'+t('nameOrId')+'" data-fl="'+f.id+'" data-idx="'+idx+'" data-sh="'+sh+'" data-dt="'+selDate+'" value="'+(p?phName(p):'')+'" '+(p?'readonly':'')+'>';
      } else {
        html += '<input type="text" class="att-in '+(p?'filled':'')+'" placeholder="—" value="'+(p?phName(p):'')+'" readonly style="cursor:default">';
      }
      html += '</div>';
      if(canEdit && p) {
        html += '<button class="btn-clr" data-act="clr-row" data-fl="'+f.id+'" data-idx="'+idx+'" data-sh="'+sh+'" data-dt="'+selDate+'" title="'+t('clearValue')+'"><i data-lucide="x"></i></button>';
      }
      if(canEdit) {
        html += '<button class="btn-del-row" data-act="del-row" data-fl="'+f.id+'" data-idx="'+idx+'" data-sh="'+sh+'" data-dt="'+selDate+'" title="'+t('deleteRow')+'"><i data-lucide="trash-2"></i></button>';
      }
      html += '</div>';
    });
    html += '</div>';
    if(canEdit) {
      html += '<div class="flr-actions">';
      html += '<button class="btn-add" data-act="add-row" data-fl="'+f.id+'" data-sh="'+sh+'" data-dt="'+selDate+'"><i data-lucide="plus"></i> '+t('addRow')+'</button>';
      html += '</div>';
    }
    html += '</div>';
  });

  if(isHistorical && !hasData && !canEdit) {
    html += '<div class="empty" style="margin-top:12px"><i data-lucide="calendar"></i><p>'+t('attNoData')+'</p></div>';
  }

  if(canEdit) {
    html += '<button class="btn btn-o btn-block mt-12" data-act="mgr-breaks" data-sh="'+sh+'" data-dt="'+selDate+'" style="border-color:var(--pur);color:var(--pur)"><i data-lucide="coffee"></i> '+t('manageBreaks')+'</button>';
  }
  /* زر طلب إضافة للجدول - للمسؤول تم إزالته */

  /* حفظ بيانات اليوم الحالي في السجل */
  if(isToday) {
    saveCurrentAttToHistory();
  }

  return html;
}

/* --- شاشة الإجازات --- */
function renderLeave() {
  var html = '';
  /* المسؤول: يرى فقط صيادلة طابقه حصراً */
  var supFloor = isSupervisor() && currentUser ? currentUser.floor : null;
  var visiblePharms = S.pharms;
  if(isSupervisor()) {
    visiblePharms = supFloor ? S.pharms.filter(function(p) { return p.fl === supFloor; }) : [];
  }
  var overPharms = visiblePharms.filter(function(p) { return getMonthLeaves(p.id).length > 3; });

  /* تنبيه المتجاوزين - فقط للمدير */
  if(isAdmin() && overPharms.length) {
    html += '<div class="alert al-err ai"><i data-lucide="alert-triangle"></i><div><strong>'+t('leaveAlert')+'</strong><br>';
    html += overPharms.map(function(p) { return phName(p)+' ('+p.id+') — '+getMonthLeaves(p.id).length+' '+t('numDays')+'/3'; }).join('<br>');
    html += '</div></div>';
  }

  /* المسؤول: عرض صيادلة الطابق */
  if(isSupervisor() && supFloor) {
    var floorObj = FLOORS.find(function(f){return f.id===supFloor});
    var floorPharms = S.pharms.filter(function(p){return p.fl === supFloor});
    if(floorPharms.length > 0) {
      html += '<div class="stitle" style="color:'+(floorObj?floorObj.clr:'var(--pri)')+'"><i data-lucide="'+(floorObj?floorObj.icon:'users')+'" style="color:'+(floorObj?floorObj.clr:'var(--pri)')+'"></i> '+(floorObj?toEN(S.lang==='ar'?floorObj.ar:floorObj.en):'')+' <span style="font-weight:400;font-size:.78rem;color:var(--mut)">('+floorPharms.length+' '+t('pharmacists')+')</span></div>';
      html += '<div style="margin-bottom:16px">';
      floorPharms.forEach(function(p) {
        var mLeaves = getMonthLeaves(p.id).length;

        var rcClr = rc > 0 ? 'var(--ok)' : 'var(--err)';

        html += '<div class="ph-inf">';
        html += '<div class="ph-nm" style="font-size:.84rem">'+phName(p)+'</div>';
        html += '<div style="font-size:.68rem;color:var(--mut)">'+p.id+' · '+t('restCredits')+': <span style="color:'+rcClr+';font-weight:700">'+rc+'</span> · '+t('monthLeaves')+': <span style="color:'+(mLeaves>3?'var(--err)':'var(--mut)')+';font-weight:700">'+mLeaves+'/3</span></div>';
        html += '</div>';
        html += '</div>';
      });

      html += '<div class="empty" style="grid-column:1/-1"><i data-lucide="check-circle"></i><p>'+t('noData')+'</p></div>';
    } else {
      exceededPharms.forEach(function(p) {
        var c = getMonthLeaves(p.id).length;
        var clr = 'var(--err)';
        html += '<div class="ai" style="background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--sh-s)">';
        html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><div class="ph-av" style="background:'+p.clr+';width:26px;height:26px;font-size:.65rem;border-radius:7px">'+p.en[0]+'</div>';
        html += '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+phName(p)+'</div>';
        html += '<div style="font-size:.65rem;color:var(--mut)">'+p.id+'</div></div></div>';
        html += '<div style="display:flex;justify-content:space-between;font-size:.7rem;margin-bottom:2px"><span style="font-weight:700;color:'+clr+'">'+c+' '+t('numDays')+'/3</span>';
        html += '<span style="color:var(--err);font-weight:600;font-size:.62rem">'+t('requiresApproval')+'</span>';
        html += '</div><div class="pbar"><div class="pfill" style="width:100%;background:'+clr+'"></div></div></div>';
      });
    }
    html += '</div>';
  }

  /* ========== إجازات قيد المراجعة ========== */
  var pendingLvList = S.leaves.filter(function(l) { return l.status === 'pending'; });
  if(isSupervisor()) {
    pendingLvList = pendingLvList.filter(function(l) {
      var p = S.pharms.find(function(x){return x.id===l.pid});
      return p && p.fl === supFloor;
    });
  }

    html += '<div class="stitle"><i data-lucide="clock"></i> '+t('pendingLeaves')+'</div>';

          html += '<div class="ph-av" style="background:'+(p?p.clr:'var(--mut)')+';width:30px;height:30px;font-size:.7rem;border-radius:8px">'+(p?p.en[0]:'?')+'</div>';

        html += '</div>';
      });
      html += '</div>';
    }
  }

  if(isAdmin()) {
    var pendingSchedList = S.pendingSchedReqs.filter(function(r) { return r.status === 'pending'; });

      pendingSchedList.forEach(function(r) {
        var p = S.pharms.find(function(x){return x.id===r.pid});
        html += '<div class="ph-row ai" style="padding:10px 12px;margin-bottom:6px">';
        html += '<div class="ph-av" style="background:'+(p?p.clr:'var(--mut)')+';width:30px;height:30px;font-size:.7rem;border-radius:8px">'+(p?p.en[0]:'?')+'</div>';
        html += '<div class="ph-inf"><div class="ph-nm" style="font-size:.82rem">'+(p?phName(p):r.pid)+'</div>';
        html += '<div style="font-size:.68rem;color:var(--mut)">'+t('morningShift')+' · '+flrName(r.fl)+' · '+toEN(r.date)+'</div></div>';
        html += '<div style="display:flex;gap:4px">';
        html += '<button class="btn btn-xs btn-s" data-act="approve-sched-req" data-rid="'+r.id+'" style="padding:5px 10px;font-size:.68rem"><i data-lucide="check" style="width:12px;height:12px"></i> '+t('approve')+'</button>';
        html += '<button class="btn btn-xs btn-d" data-act="reject-sched-req" data-rid="'+r.id+'" style="padding:5px 10px;font-size:.68rem"><i data-lucide="x" style="width:12px;height:12px"></i> '+t('reject')+'</button>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
  }

  return html;
}

/* --- تدوير الصيادلة (روتيشن) --- */
function renderStaffRotation() {
  var html = '';
  var supFloor = isSupervisor() && currentUser ? currentUser.floor : null;
  var floorsToShow = FLOORS;

    ps.forEach(function(p) {
      html += '<div class="ph-row ai" style="cursor:pointer" data-act="pharm-detail" data-pid="'+p.id+'"><div class="ph-av" style="background:'+p.clr+'">'+p.en[0]+'</div>';
      html += '<div class="ph-inf"><div class="ph-nm">'+phName(p)+(p.cat?' <span style="font-size:.68rem;font-weight:600;color:var(--pri)">'+(p.cat==='practicing'?t('catPracticing'):p.cat==='exempt'?t('catExempt'):t('catTrainee'))+'</span>':'')+'</div><div class="ph-id">'+p.id+' · '+flrName(p.fl)+'</div></div>';
      if(isAdmin()) {
        html += '<button class="ibtn" data-act="edit-pharm" data-pid="'+p.id+'" title="'+t('editPharmacist')+'" style="width:32px;height:32px;background:var(--pri-s);color:var(--pri);border-radius:8px"><i data-lucide="pencil" style="width:14px;height:14px"></i></button>';
        html += '<button class="ibtn" data-act="delete-pharm-direct" data-pid="'+p.id+'" title="'+t('deletePharmacist')+'" style="width:32px;height:32px;background:var(--err-s);color:var(--err);border-radius:8px"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>';
      } else {
        html += '<i data-lucide="chevron-left" style="width:18px;height:18px;color:var(--mut);flex-shrink:0"></i>';

      html += '</div>';
    });
    html += '</div>';
  });
  if(!html) html = '<div class="empty"><i data-lucide="users"></i><p>'+t('noData')+'</p></div>';
  return html;
